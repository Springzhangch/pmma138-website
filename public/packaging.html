<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粤丰包材数量计算器</title>
<style>
  :root{
    --bg:#eef1f5;
    --card:#ffffff;
    --line:#e4e8ee;
    --line-soft:#eef1f6;
    --text:#16191f;
    --sub:#78818e;
    --primary:#2f6fed;
    --primary-soft:#ecf2ff;
    --danger:#e5342c;
    --danger-soft:#fdeeed;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.45;
  }

  /* ---------- 骨架：一屏三栏 ---------- */
  .app{
    height:100vh;max-width:1760px;margin:0 auto;
    display:flex;flex-direction:column;gap:11px;padding:11px 16px 13px;
  }
  .grid{
    flex:1;min-height:0;
    display:grid;gap:11px;
    /* 第 1、2 栏等宽（内箱 / 外箱），多出的宽度给第 3 栏（预览 + 用量汇总） */
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.18fr);
  }
  .col{display:flex;flex-direction:column;gap:11px;min-height:0}
  .card{
    background:var(--card);border:1px solid var(--line-soft);border-radius:13px;
    padding:11px 13px;box-shadow:0 1px 2px rgba(16,24,40,.04);
    display:flex;flex-direction:column;min-height:0;
  }
  .card.grow{flex:1}
  .card-title{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:650;margin-bottom:10px;flex:none}
  .card-title i{width:4px;height:15px;border-radius:2px;background:var(--primary);display:block;flex:none}
  .card-title .spacer{flex:1}
  .card-title .hint{font-size:12px;font-weight:400;color:var(--sub)}

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:none;display:flex;align-items:center;gap:18px;
    background:#fff;border:1px solid var(--line-soft);border-radius:13px;
    padding:11px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:.2px}
  .topbar .brand em{
    font-style:normal;font-size:11.5px;font-weight:500;color:var(--primary);
    background:var(--primary-soft);padding:2px 8px;border-radius:20px;
  }
  .tb-field{display:flex;align-items:center;gap:8px}
  .tb-field > span{font-size:13.5px;color:var(--sub);white-space:nowrap}
  .tb-field .ipt{width:190px}
  .tb-field .ipt.narrow{width:104px}
  .tb-sum{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tb-item{
    display:flex;align-items:baseline;gap:6px;background:#f7f9fd;border:1px solid var(--line-soft);
    border-radius:10px;padding:6px 14px;
  }
  .tb-item span{font-size:13px;color:var(--sub)}
  .tb-item b{font-size:23px;font-weight:700;color:var(--primary);line-height:1.1}
  .tb-item u{text-decoration:none;font-size:12.5px;color:var(--sub)}
  .tb-item.warm b{color:#c47f12}

  /* ---------- 表单 ---------- */
  .ipt{
    width:100%;height:37px;border:1px solid var(--line);border-radius:8px;
    background:#fafbfc;padding:0 10px;font-size:14px;color:var(--text);
    font-family:inherit;outline:none;transition:.15s;appearance:none;
  }
  .ipt:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.10)}
  .ipt.over{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);font-weight:700}
  .ipt.qbad{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);font-weight:700}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}

  .row-inline{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
  .row-inline .lb{font-size:13.5px;color:var(--sub);white-space:nowrap}
  .row-inline .lb.strong{font-weight:700;color:var(--text);font-size:14px;margin-left:auto}
  .row-inline .unit{font-size:13px;color:var(--sub);margin-left:-3px}
  .ipt.strong{
    width:62px;flex:none;height:34px;text-align:center;font-size:17px;font-weight:700;
    color:var(--primary);border-color:#c3d5f7;background:#f4f8ff;
  }
  .ipt.strong:focus{background:#fff;border-color:var(--primary)}
  .ipt.thick{
    width:62px;flex:none;height:34px;text-align:center;font-size:15px;font-weight:700;
    color:var(--text);border-color:#cdd7e6;background:#fffdf7;
  }
  .ipt.thick:focus{background:#fff;border-color:var(--primary)}
  .ipt.thick.full{width:auto;flex:auto;height:37px;font-size:14px}
  .seg{display:flex;background:#f1f3f7;border-radius:9px;padding:3px;gap:3px;width:144px;flex:none}
  .seg button{
    flex:1;height:31px;border:0;border-radius:7px;background:transparent;color:var(--sub);
    font-size:13.5px;font-family:inherit;cursor:pointer;transition:.15s;font-weight:500;
  }
  .seg button.on{background:#fff;color:var(--primary);font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.10)}

  .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .dims.four{grid-template-columns:1fr 1fr 1fr 1.12fr}
  .dims .f label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}

  .switch{position:relative;display:inline-block;width:40px;height:23px;flex:none}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch .slider{position:absolute;inset:0;background:#d7dce4;border-radius:99px;transition:.2s;cursor:pointer}
  .switch .slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider:before{transform:translateX(17px)}

  /* ---------- 物料表 ---------- */
  .mwrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:10px}
  .mhead,.mrow{display:grid;grid-template-columns:1.25fr .9fr .8fr .8fr .8fr .78fr 28px;gap:5px;align-items:center}
  .mhead{
    position:sticky;top:0;z-index:2;background:#f6f8fb;padding:8px;
    font-size:12.5px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line-soft);
  }
  .mrow{padding:5px 8px;border-bottom:1px solid #f4f6fa}
  .mrow:last-child{border-bottom:0}
  .mrow.has-over{background:#fefafa}
  .mrow .ipt{height:34px;padding:0 5px;font-size:13.5px;text-align:center}
  .mrow select.ipt{padding:0 3px;text-align:left}
  .mrow .icon-btn{
    width:28px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;
    color:#a3abb7;font-size:13px;cursor:pointer;font-family:inherit;line-height:1;padding:0;
  }
  .mrow .icon-btn:hover{color:var(--danger);border-color:#f4c8c5;background:#fff7f6}
  .btn{
    margin-top:10px;flex:none;height:36px;width:100%;border:1px dashed #c9d5ea;border-radius:9px;
    background:#f7faff;color:var(--primary);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--primary-soft);border-color:var(--primary)}
  .tip{margin:0 0 10px;font-size:12.5px;color:var(--sub);flex:none;line-height:1.6}
  .tip.warn-tip{color:#b7791f;font-weight:500}
  .tip.danger{color:var(--danger);font-weight:600}
  .empty{font-size:13px;color:#a7b0bd;text-align:center;padding:16px 0}

  /* ---------- 预览 ---------- */
  .viz{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#fbfcfe;border:1px solid var(--line-soft);border-radius:11px;padding:4px 6px 6px}
  .viz + .viz{margin-top:9px}
  .viz svg{width:100%;height:100%;min-height:0;display:block}
  .viz .caption{flex:none;text-align:center;font-size:12px;color:var(--sub);padding-top:3px;line-height:1.5}
  .viz .vcap{flex:none;font-size:12.5px;font-weight:600;color:var(--primary);letter-spacing:.4px}
  .viz .vcap.g{color:#b7791f}
  .viz-empty{font-size:13px;color:#a7b0bd;padding:22px 10px;text-align:center}

  /* ---------- 结果 ---------- */
  .note{margin:0 0 8px;font-size:12.5px;color:var(--sub);flex:none;line-height:1.55}
  .note.vbad{color:var(--danger);font-weight:600}
  .note.vok{color:#2f8f4e}
  .rlist{flex:1;min-height:0;overflow:auto}
  .li{padding:7px 0;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
  .li:last-child{border-bottom:0}
  .li .meta{
    font-size:12.5px;color:var(--sub);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;
  }
  .li .tot{flex:none;font-size:15px;font-weight:700;color:var(--primary);white-space:nowrap}
  .li .per{flex:none;font-size:12.5px;font-weight:600;color:#5c6675;background:#f2f4f7;
           padding:2px 7px;border-radius:5px;white-space:nowrap}
  .li .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-weight:650;flex:none}
  .li .tag.o{background:#fff3e2;color:#b7791f}
  .li .nm{font-size:14px;font-weight:600;white-space:nowrap;flex:none}
  .li .pos{font-size:11.5px;padding:2px 7px;border-radius:5px;background:#f2f4f7;color:#5c6675;flex:none}
  .li .base{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:700;flex:none}
  .li .base.i{background:#e8f0ff;color:var(--primary)}
  .li .base.o{background:#fff3e2;color:#b7791f}

  /* ---------- 窄屏回退（可滚动单列） ---------- */
  @media (max-width:1180px){
    html,body{height:auto}
    body{overflow:auto}
    .app{height:auto;max-width:none;padding:11px}
    .grid{grid-template-columns:1fr}
    .viz{height:230px}
    .topbar{flex-wrap:wrap;gap:10px}
    .tb-sum{margin-left:0}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ========== 顶栏：产品 + 关键结果 ========== -->
  <header class="topbar">
    <div class="brand">粤丰包材数量计算器 <em>产品 → 内箱 → 外箱</em></div>
    <div class="tb-field">
      <span>产品名称</span>
      <input id="pName" class="ipt" type="text" placeholder="选填">
    </div>
    <div class="tb-field">
      <span>产品数量</span>
      <input id="pQty" class="ipt narrow" type="number" inputmode="decimal" min="1" step="1" value="1">
    </div>
    <div class="tb-sum">
      <div class="tb-item"><span>内箱</span><b id="rInner">0</b><u>个</u></div>
      <div class="tb-item warm"><span>外箱</span><b id="rOuter">0</b><u>个</u></div>
    </div>
  </header>

  <div class="grid">

    <!-- ========== 第 1 栏：内箱 ========== -->
    <div class="col">
      <section class="card">
        <div class="card-title"><i></i>内箱尺寸</div>
        <div class="row-inline">
          <span class="lb">尺寸类型</span>
          <div class="seg" id="innerType">
            <button type="button" data-val="inner">内尺寸</button>
            <button type="button" data-val="outer">外尺寸</button>
          </div>
          <span class="lb strong">每箱装入产品数</span>
          <input id="innerPer" class="ipt strong" type="number" inputmode="numeric" min="1" step="1" value="1">
          <span class="unit">个</span>
        </div>
        <div class="dims four">
          <div class="f"><label>长 (mm)</label><input id="innerL" class="ipt" type="number" inputmode="decimal" placeholder="0"></div>
          <div class="f"><label>宽 (mm)</label><input id="innerW" class="ipt" type="number" inputmode="decimal" placeholder="0"></div>
          <div class="f"><label>高 (mm)</label><input id="innerH" class="ipt" type="number" inputmode="decimal" placeholder="0"></div>
          <div class="f"><label>纸箱厚度 (mm)</label><input id="innerT" class="ipt thick full" type="number" inputmode="decimal" min="0" step="0.5" value="5"></div>
        </div>
      </section>

      <section class="card grow">
        <div class="card-title"><i></i>内箱物料<span class="spacer"></span><span class="hint">尺寸单位 mm</span></div>
        <p class="tip" id="innerLimit"></p>
        <div class="mwrap">
          <div class="mhead">
            <span>物料</span><span>位置</span><span>长</span><span>宽</span><span>高</span><span>用量</span><span></span>
          </div>
          <div id="innerMatList"></div>
        </div>
        <button class="btn" id="addInner" type="button">+ 添加内箱物料</button>
      </section>
    </div>

    <!-- ========== 第 2 栏：外箱 ========== -->
    <div class="col">
      <section class="card">
        <div class="card-title">
          <i></i>外箱
          <span class="spacer"></span>
          <label class="switch"><input type="checkbox" id="outerOn" checked><span class="slider"></span></label>
        </div>
        <div id="outerBody">
          <div class="row-inline">
            <span class="lb">尺寸类型</span>
            <div class="seg" id="outerType">
              <button type="button" data-val="inner">内尺寸</button>
              <button type="button" data-val="outer">外尺寸</button>
            </div>
            <span class="lb strong">每箱装入内箱数</span>
            <input id="outerPer" class="ipt strong" type="number" inputmode="numeric" min="1" step="1" value="10">
            <span class="unit">个</span>
          </div>
          <div class="dims four">
            <div class="f"><label>长 (mm)</label><input id="outerL" class="ipt" type="number" inputmode="decimal" placeholder="0"></div>
            <div class="f"><label>宽 (mm)</label><input id="outerW" class="ipt" type="number" inputmode="decimal" placeholder="0"></div>
            <div class="f"><label>高 (mm)</label><input id="outerH" class="ipt" type="number" inputmode="decimal" placeholder="0"></div>
            <div class="f"><label>纸箱厚度 (mm)</label><input id="outerT" class="ipt thick full" type="number" inputmode="decimal" min="0" step="0.5" value="5"></div>
          </div>
          <p class="tip danger" id="outerFitHint" style="display:none;margin:9px 0 0"></p>
        </div>
      </section>

      <section class="card grow" id="outerMatCard">
        <div class="card-title"><i></i>外箱物料<span class="spacer"></span><span class="hint">尺寸单位 mm</span></div>
        <p class="tip" id="outerLimit"></p>
        <div class="mwrap">
          <div class="mhead">
            <span>物料</span><span>位置</span><span>长</span><span>宽</span><span>高</span><span>用量</span><span></span>
          </div>
          <div id="outerMatList"></div>
        </div>
        <button class="btn" id="addOuter" type="button">+ 添加外箱物料</button>
      </section>
    </div>

    <!-- ========== 第 3 栏：预览 + 结果 ========== -->
    <div class="col">
      <section class="card grow" style="flex:1.15">
        <div class="card-title"><i></i>箱体外轮廓预览</div>
        <div class="viz" id="innerViz"></div>
        <div class="viz" id="outerViz"></div>
      </section>

      <section class="card grow">
        <div class="card-title"><i></i>用量汇总<span class="spacer"></span><span class="hint">含箱体与物料</span></div>
        <p class="note" id="rNote"></p>
        <p class="note" id="rVol" style="display:none"></p>
        <div class="rlist" id="rList"></div>
      </section>
    </div>

  </div>
</div>

<script>
/* =========================================================
   常量
   ========================================================= */
var DEFAULT_T = 5;   // 默认纸箱厚度 5mm
var MATS = ['珍珠棉片', '保丽龙', '拉伸膜'];
// 单件位置：可填任意整数；组合位置：数量必须为 2 或 2 的倍数
var POS   = ['上', '下', '左', '右', '前', '后', '隔板', '垫片', '上下', '左右', '前后'];
var COMBO = ['上下', '左右', '前后'];

/* =========================================================
   状态
   ========================================================= */
var S = {
  inner: { type: 'inner', L: '', W: '', H: '', t: String(DEFAULT_T), perUnit: '1' },  // perUnit：每内箱装入的产品数
  outer: { on: true, type: 'inner', L: '', W: '', H: '', t: String(DEFAULT_T), perBox: '10' },
  innerMats: [],
  outerMats: []
};

/* =========================================================
   工具
   ========================================================= */
function $(sel){ return document.querySelector(sel); }
function $$(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : null; }
function fmt(n){
  if(n === null || !isFinite(n)) return '—';
  return String(Math.round(n * 100) / 100);
}
function round1(n){ return Math.round(n * 10) / 10; }
/* 体积：mm³ → m³ */
function cbm(L, W, H){ return (L * W * H) / 1000000000; }
function fmt3(n){ return (Math.round(n * 1000) / 1000).toFixed(3); }

/* 读取单个尺寸：不填 / 负数 一律按 0 处理 */
function val0(x){
  var n = num(x);
  if(n === null || n < 0) n = 0;
  return n;
}

/* 按「纸箱厚度」换算内尺寸 / 外轮廓
   选内尺寸：外尺寸 = 内尺寸 + 厚度×2
   选外尺寸：内尺寸 = 外尺寸 − 厚度×2   */
function dimsOf(box){
  var t = val0(box.t);
  var L = val0(box.L), W = val0(box.W), H = val0(box.H);
  var inner, outer;
  if(box.type === 'inner'){
    inner = { L: L, W: W, H: H };
    outer = { L: L + 2 * t, W: W + 2 * t, H: H + 2 * t };
  }else{
    outer = { L: L, W: W, H: H };
    inner = { L: Math.max(0, L - 2 * t), W: Math.max(0, W - 2 * t), H: Math.max(0, H - 2 * t) };
  }
  return { inner: inner, outer: outer, t: t, blank: (L <= 0 && W <= 0 && H <= 0) };
}
/* 判定上限 = 箱体内部最大尺寸（未填写箱体时按 0 计） */
function limitOf(box){
  var d = dimsOf(box);
  return Math.max(d.inner.L, d.inner.W, d.inner.H);
}

/* =========================================================
   箱体可视化
   ========================================================= */
var VW = 340, VH = 200, PADX = 74, PADY = 44;

function f(n){ return (Math.round(n * 100) / 100).toFixed(2); }

function textW(t){
  var w = 0;
  for(var i = 0; i < t.length; i++){
    var ch = t.charAt(i);
    if(/[\u4e00-\u9fa5]/.test(ch)) w += 11.5;
    else if(ch === ' ') w += 3.7;
    else w += 6.6;
  }
  return w;
}
function lineEl(p1, p2, stroke, w){
  return '<line x1="' + f(p1[0]) + '" y1="' + f(p1[1]) + '" x2="' + f(p2[0]) + '" y2="' + f(p2[1]) +
         '" stroke="' + stroke + '" stroke-width="' + w + '" stroke-linecap="round"/>';
}
function chip(x, y, text){
  var w = 12 + textW(text), h = 17;
  return '<g><rect x="' + f(x - w / 2) + '" y="' + f(y - h / 2) + '" width="' + f(w) + '" height="' + h +
    '" rx="5" fill="#ffffff" stroke="#dbe3ef"/>' +
    '<text x="' + f(x) + '" y="' + f(y) + '" text-anchor="middle" dominant-baseline="central" ' +
    'font-size="11.5" font-weight="700" fill="#2f6fed" font-family="inherit">' + text + '</text></g>';
}
/* 在边的外侧画尺寸线 + 端点短线 + 数值标签 */
function dimMark(p1, p2, text, cx, cy){
  var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
  var vx = mx - cx, vy = my - cy, len = Math.hypot(vx, vy) || 1, off = 25;
  var a = [p1[0] + vx / len * off, p1[1] + vy / len * off];
  var b = [p2[0] + vx / len * off, p2[1] + vy / len * off];
  var dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
  var tx = -dy / dl * 4.5, ty = dx / dl * 4.5;
  var s = '';
  s += lineEl(p1, a, '#d3ddea', 1);
  s += lineEl(p2, b, '#d3ddea', 1);
  s += lineEl(a, b, '#2f6fed', 1.3);
  s += lineEl([a[0] - tx, a[1] - ty], [a[0] + tx, a[1] + ty], '#2f6fed', 1.3);
  s += lineEl([b[0] - tx, b[1] - ty], [b[0] + tx, b[1] + ty], '#2f6fed', 1.3);
  s += chip((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, text);
  return s;
}
function boxSVG(o){
  var L = o.L, W = o.W, H = o.H;
  if(L <= 0 || W <= 0 || H <= 0) return '';
  var ux = L + 0.5 * W, uy = H + 0.42 * W;
  var sc = Math.min((VW - 2 * PADX) / ux, (VH - 2 * PADY) / uy);
  sc = Math.min(sc, 2.2);
  if(!isFinite(sc) || sc <= 0) sc = 1;
  var ox = (VW - ux * sc) / 2, oy = (VH - uy * sc) / 2;
  function P(x, y, z){ return [ox + (x + 0.5 * y) * sc, oy + uy * sc - (z + 0.42 * y) * sc]; }

  var A = P(0, 0, 0), B = P(L, 0, 0), C = P(L, 0, H), D = P(0, 0, H);
  var E = P(0, W, H), F = P(L, W, H), G = P(L, W, 0);
  var cx = ox + ux * sc / 2, cy = oy + uy * sc / 2;

  function poly(pts, fill){
    return '<polygon points="' + pts.map(function(p){ return f(p[0]) + ',' + f(p[1]); }).join(' ') +
           '" fill="' + fill + '" stroke="#a9bbd6" stroke-width="1.2" stroke-linejoin="round"/>';
  }
  var svg = '<svg viewBox="0 0 ' + VW + ' ' + VH + '" preserveAspectRatio="xMidYMid meet">';
  svg += poly([B, G, F, C], '#e4ecfa');   // 右侧面
  svg += poly([D, C, F, E], '#ffffff');   // 顶面
  svg += poly([A, B, C, D], '#f3f7ff');   // 正面
  svg += dimMark(A, B, '长 ' + fmt(L) + 'mm', cx, cy);   // 底前边 = 长
  svg += dimMark(D, A, '高 ' + fmt(H) + 'mm', cx, cy);   // 左前竖边 = 高
  svg += dimMark(C, F, '宽 ' + fmt(W) + 'mm', cx, cy);   // 顶右后边 = 宽
  svg += '<text x="6" y="15" font-size="10.5" fill="#a7b0bd" font-family="inherit">单位 mm · 外轮廓</text>';
  svg += '</svg>';
  return svg;
}

/* =========================================================
   渲染
   ========================================================= */
function renderViz(sel, box, label, cls){
  var host = $(sel);
  var d = dimsOf(box);
  var head = '<div class="vcap ' + (cls || '') + '">' + label + '</div>';
  if(d.blank){
    host.innerHTML = head + '<div class="viz-empty">填写长、宽、高后自动显示外轮廓</div>';
    return;
  }
  var cap = '内尺寸 ' + fmt(d.inner.L) + ' × ' + fmt(d.inner.W) + ' × ' + fmt(d.inner.H) +
            '　|　外轮廓 ' + fmt(d.outer.L) + ' × ' + fmt(d.outer.W) + ' × ' + fmt(d.outer.H) +
            ' mm　（纸箱厚度 ' + fmt(d.t) + 'mm）';
  host.innerHTML = head + boxSVG(d.outer) + '<div class="caption">' + cap + '</div>';
}
function renderLimit(sel, box){
  var el = $(sel), lim = limitOf(box);
  if(lim <= 0){
    el.textContent = '箱体尺寸未填写 → 内部空间按 0mm 计，物料填入任一尺寸都会标红';
    el.className = 'tip warn-tip';
    return;
  }
  el.textContent = '判定上限 ' + fmt(lim) + ' mm（内尺寸最大值）｜ 超出该数值的尺寸自动标红';
  el.className = 'tip';
}
/* 两级校验：① 单边比对 ② 总体积比对，任一不满足 → 外箱尺寸标红 */
function checkFit(){
  var on = S.outer.on;
  var di = dimsOf(S.inner), dx = dimsOf(S.outer);
  var perBox = val0(S.outer.perBox);

  /* ① 内箱外轮廓任意一边 > 外箱内尺寸 → 该边标红 */
  var edgeBad = { L: false, W: false, H: false }, anyEdge = false, edgeList = [];
  if(on && !di.blank && !dx.blank){
    ['L', 'W', 'H'].forEach(function(k){
      if(di.outer[k] > dx.inner[k] + 1e-6){
        edgeBad[k] = true; anyEdge = true;
        edgeList.push(NAMES[k] + '：内箱外轮廓 ' + fmt(di.outer[k]) + ' > 外箱内尺寸 ' + fmt(dx.inner[k]));
      }
    });
  }

  /* ② perBox 个内箱的外形总体积 > 外箱内腔体积 → 三边全部标红 */
  var vOne = cbm(di.outer.L, di.outer.W, di.outer.H);   // 单个内箱外形体积
  var vHas = cbm(dx.inner.L, dx.inner.W, dx.inner.H);   // 外箱内腔体积
  var vNeed = vOne * perBox;
  var volBad = (on && perBox > 0 && !di.blank && !dx.blank && vNeed > vHas + 1e-9);
  window._vol = { need: vNeed, has: vHas, perBox: perBox, one: vOne, bad: volBad, ready: (on && perBox > 0 && !di.blank && !dx.blank) };

  ['L', 'W', 'H'].forEach(function(k){
    document.getElementById('outer' + k).classList.toggle('over', edgeBad[k] || volBad);
  });

  var hint = $('#outerFitHint'), msgs = [];
  if(anyEdge) msgs.push('⚠ 单边装不下 → ' + edgeList.join('　｜　') + '（mm）');
  if(volBad) msgs.push('⚠ 体积装不下 → ' + fmt(perBox) + ' 个内箱外形体积 ' + fmt3(vNeed) +
                       ' m³ ＞ 外箱内腔体积 ' + fmt3(vHas) + ' m³（占用 ' + fmt(vHas > 0 ? vNeed / vHas * 100 : 0) + '%）');
  if(msgs.length){
    hint.style.display = '';
    hint.innerHTML = msgs.join('<br>');
  }else{
    hint.style.display = 'none';
    hint.innerHTML = '';
  }
}
var NAMES = { L: '长', W: '宽', H: '高' };

/* =========================================================
   物料行
   ========================================================= */
function makeRow(kind, init){
  var data = { material: '珍珠棉片', position: '上', L: '', W: '', H: '', qty: '1' };
  if(init) for(var k in init) if(init.hasOwnProperty(k)) data[k] = init[k];

  var el = document.createElement('div');
  el.className = 'mrow';
  el.innerHTML =
    '<select class="ipt" data-f="material">' +
      MATS.map(function(m){ return '<option value="' + m + '">' + m + '</option>'; }).join('') +
    '</select>' +
    '<select class="ipt" data-f="position">' +
      POS.map(function(p){ return '<option value="' + p + '">' + p + '</option>'; }).join('') +
    '</select>' +
    '<input class="ipt" type="number" inputmode="decimal" data-f="L" placeholder="长">' +
    '<input class="ipt" type="number" inputmode="decimal" data-f="W" placeholder="宽">' +
    '<input class="ipt" type="number" inputmode="decimal" data-f="H" placeholder="高">' +
    '<input class="ipt" type="number" inputmode="numeric" data-f="qty">' +
    '<button type="button" class="icon-btn" data-f="del" title="删除该物料">✕</button>';

  function q(field){ return el.querySelector('[data-f="' + field + '"]'); }
  function isCombo(){ return COMBO.indexOf(data.position) >= 0; }
  /* 数量取值规则：组合位置取 ≥2 的偶数（用户不得填 1）；单件位置取 ≥1 的整数 */
  function fixedQty(){
    var v = num(data.qty);
    if(isCombo()){
      if(v === null || v < 2) return 2;
      return Math.ceil(v / 2) * 2;
    }
    if(v === null || v < 1) return 1;
    return Math.floor(v);
  }
  function applyQtyUI(force){
    var inp = q('qty'), c = isCombo();
    inp.setAttribute('min', c ? '2' : '1');
    inp.setAttribute('step', c ? '2' : '1');
    inp.title = c ? '组合位置（上下/左右/前后）：数量须为 2 或 2 的倍数' : '单件位置：数量可填任意整数（≥1）';
    var v = num(data.qty);
    var bad = c && (v === null || v < 2 || Math.abs(v / 2 - Math.round(v / 2)) > 1e-9);
    if(force && bad){                       // 切换位置或失焦时强制修正
      var s = String(fixedQty());
      inp.value = s; data.qty = s; bad = false;
    }
    inp.classList.toggle('qbad', bad);
  }

  q('material').value = data.material;
  q('position').value = data.position;
  q('L').value = data.L;
  q('W').value = data.W;
  q('H').value = data.H;
  q('qty').value = data.qty;
  applyQtyUI(false);

  ['material', 'position', 'L', 'W', 'H', 'qty'].forEach(function(field){
    var node = q(field);
    function sync(e){
      data[field] = node.value;
      if(field === 'position') applyQtyUI(true);
      if(field === 'qty') applyQtyUI(false);
      refresh();
    }
    node.addEventListener('input', sync);
    node.addEventListener('change', sync);
  });
  q('qty').addEventListener('blur', function(){ applyQtyUI(true); refresh(); });

  var item = { data: data, el: el, fixedQty: fixedQty };
  q('del').addEventListener('click', function(){
    var arr = (kind === 'inner') ? S.innerMats : S.outerMats;
    var i = arr.indexOf(item);
    if(i > -1) arr.splice(i, 1);
    el.parentNode.removeChild(el);
    refresh();
  });
  return item;
}
function addRow(kind, init, targetId){
  var item = makeRow(kind, init);
  ((kind === 'inner') ? S.innerMats : S.outerMats).push(item);
  $(targetId).appendChild(item.el);
  return item;
}
/* 物料任一尺寸 > 上限 → 该数字标红 */
function validate(item, limit){
  var over = false;
  ['L', 'W', 'H'].forEach(function(field){
    var inp = item.el.querySelector('[data-f="' + field + '"]');
    var v = num(item.data[field]);
    var bad = (v !== null && v > limit + 1e-6);
    inp.classList.toggle('over', bad);
    if(bad) over = true;
  });
  item.el.classList.toggle('has-over', over);
}

/* =========================================================
   结果
   ========================================================= */
function renderResults(){
  var pq = num($('#pQty').value);
  pq = pq === null ? 0 : Math.max(0, Math.round(pq));

  var perUnit = val0(S.inner.perUnit);                    // 每个内箱装入的产品数
  var rawInner = 0, innerCount = 0;
  if(perUnit > 0 && pq > 0){
    rawInner = pq / perUnit;
    innerCount = Math.ceil(rawInner);                     // 有小数向上取整
  }

  var on = S.outer.on;
  var perBox = on ? val0(S.outer.perBox) : 0;             // 每个外箱装入的内箱数

  var raw = 0, outerCount = 0;
  if(on && perBox > 0 && innerCount > 0){
    raw = innerCount / perBox;
    outerCount = Math.ceil(raw);                          // 有小数向上取整：26.1 → 27
  }

  $('#rInner').textContent = innerCount;
  $('#rOuter').textContent = on ? outerCount : 0;

  /* 逐级换算说明 */
  var step1 = (perUnit > 0 && pq > 0)
    ? pq + ' 个产品 ÷ 每内箱 ' + fmt(perUnit) + ' 个 = ' + fmt(round1(rawInner)) + ' 个内箱 → ' + innerCount + ' 个'
    : (perUnit <= 0 ? '请填写「每箱装入产品数」' : '请填写产品数量');
  var step2 = '';
  if(on){
    if(perBox <= 0) step2 = '　｜　请填写「每箱装入内箱数」';
    else if(innerCount > 0) step2 = '　｜　' + innerCount + ' 个内箱 ÷ 每外箱 ' + fmt(perBox) + ' 个 = ' +
                                    fmt(round1(raw)) + ' 个外箱 → ' + outerCount + ' 个';
  }else{
    step2 = '　｜　未勾选外箱';
  }
  $('#rNote').textContent = step1 + step2;

  /* 体积核算（外箱勾选时才算） */
  var volEl = $('#rVol'), V = window._vol;
  if(!on){
    volEl.style.display = 'none';
    volEl.textContent = '';
  }else if(V && V.ready){
    volEl.style.display = '';
    var pct = V.has > 0 ? V.need / V.has * 100 : 0;
    volEl.className = V.bad ? 'note vbad' : 'note vok';
    volEl.textContent = '每个外箱需容纳 ' + fmt(V.perBox) + ' 个内箱 = ' + fmt3(V.need) +
      ' m³ ｜ 外箱内腔 ' + fmt3(V.has) + ' m³ ｜ 占用 ' + fmt(pct) + '%' +
      (V.bad ? '　⚠ 装不下，外箱体积不足' : '　✓ 可容纳');
  }else{
    volEl.style.display = '';
    volEl.className = 'note';
    volEl.textContent = '填好内箱、外箱尺寸与每箱内箱数后，自动核算总体积是否装得下';
  }

  /* 用量汇总：箱体本体 + 物料清单（四类均显示基数） */
  var bIn = Number(fmt(perUnit));    // 内箱系列的基数 = 每箱内箱装入的产品数
  var bOut = Number(fmt(perBox));    // 外箱系列的基数 = 每箱外箱装入的内箱数
  var html = '';
  html += boxHTML('内箱本体', '内箱', '', S.inner, innerCount, bIn, 'i');
  html += matHTML(S.innerMats, innerCount, '内箱', '', bIn, 'i');
  if(on){
    html += boxHTML('外箱本体', '外箱', ' o', S.outer, outerCount, bOut, 'o');
    html += matHTML(S.outerMats, outerCount, '外箱', ' o', bOut, 'o');
  }
  $('#rList').innerHTML = html;
}

/* 箱体本体条目：名称 + 外轮廓尺寸 + 数量（全部同一行） */
function boxHTML(name, tagText, tagCls, box, count, base, bCls){
  var d = dimsOf(box);
  var meta = d.blank
    ? '尺寸未填写'
    : '外轮廓 ' + fmt(d.outer.L) + ' × ' + fmt(d.outer.W) + ' × ' + fmt(d.outer.H) + ' mm　·　厚度 ' + fmt(d.t) + 'mm';
  return '<div class="li">' +
    '<span class="tag' + tagCls + '">' + tagText + '</span>' +
    '<span class="nm">' + name + '</span>' +
    '<span class="meta">' + meta + '</span>' +
    '<span class="tot">总数 ' + fmt(count) + '</span>' +
    '<span class="base ' + bCls + '">基数 ' + (base > 0 ? base : '—') + '</span>' +
  '</div>';
}

/* 物料清单 */
function matHTML(items, boxCount, tagText, tagCls, base, bCls){
  if(!items.length) return '<div class="empty">' + tagText + '未添加物料</div>';
  var box = (tagText === '内箱') ? S.inner : S.outer;
  var limit = limitOf(box);

  return items.map(function(item){
    var d = item.data;
    var emptySize = (num(d.L) === null && num(d.W) === null && num(d.H) === null);
    var over = false;
    ['L', 'W', 'H'].forEach(function(k){
      var v = num(d[k]);
      if(v !== null && v > limit + 1e-6) over = true;
    });
    var sizeTxt = emptySize
      ? '尺寸待填'
      : [d.L, d.W, d.H].map(function(v){ return num(v) === null ? '—' : fmt(num(v)); }).join(' × ') + ' mm';
    var per = item.fixedQty();
    var meta = sizeTxt + (over ? '　⚠ 超出箱体内部空间' : '');

    return '<div class="li">' +
      '<span class="tag' + tagCls + '">' + tagText + '</span>' +
      '<span class="nm">' + d.material + '</span>' +
      '<span class="pos">' + d.position + '</span>' +
      '<span class="meta"' + (over ? ' style="color:var(--danger);font-weight:600"' : '') + '>' + meta + '</span>' +
      '<span class="tot">总数 ' + fmt(per * boxCount) + '</span>' +
      '<span class="per">单箱数量 ' + per + '</span>' +
      '<span class="base ' + bCls + '">基数 ' + (base > 0 ? base : '—') + '</span>' +
    '</div>';
  }).join('');
}

/* =========================================================
   刷新
   ========================================================= */
function refresh(){
  var on = S.outer.on;

  renderViz('#innerViz', S.inner, '内箱外轮廓', '');
  renderLimit('#innerLimit', S.inner);
  var li = limitOf(S.inner);
  S.innerMats.forEach(function(it){ validate(it, li); });

  $('#outerBody').style.display = on ? '' : 'none';
  $('#outerMatCard').style.display = on ? '' : 'none';
  $('#outerViz').style.display = on ? '' : 'none';

  if(on){
    renderViz('#outerViz', S.outer, '外箱外轮廓', 'g');
    renderLimit('#outerLimit', S.outer);
    var lo = limitOf(S.outer);
    S.outerMats.forEach(function(it){ validate(it, lo); });
  }
  checkFit();
  renderResults();
}

/* =========================================================
   绑定
   ========================================================= */
function bindBox(prefix, box){
  ['L', 'W', 'H', 't'].forEach(function(field){
    var el = document.getElementById(prefix + field);
    if(!el) return;
    el.value = box[field];
    el.addEventListener('input', function(){ box[field] = el.value; refresh(); });
  });
}
function bindSeg(sel, box){
  var buttons = $$(sel + ' button');
  function paint(){
    buttons.forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-val') === box.type); });
  }
  buttons.forEach(function(b){
    b.addEventListener('click', function(){ box.type = b.getAttribute('data-val'); paint(); refresh(); });
  });
  paint();
}

bindBox('inner', S.inner);
bindBox('outer', S.outer);
bindSeg('#innerType', S.inner);
bindSeg('#outerType', S.outer);

$('#pQty').addEventListener('input', refresh);
$('#innerPer').addEventListener('input', function(){ S.inner.perUnit = $('#innerPer').value; refresh(); });
$('#outerPer').addEventListener('input', function(){ S.outer.perBox = $('#outerPer').value; refresh(); });
$('#outerOn').addEventListener('change', function(){ S.outer.on = $('#outerOn').checked; refresh(); });

$('#addInner').addEventListener('click', function(){ addRow('inner', null, '#innerMatList'); refresh(); });
$('#addOuter').addEventListener('click', function(){ addRow('outer', null, '#outerMatList'); refresh(); });

/* 默认三组组合位置：上下 / 前后 / 左右，数量默认 2 */
[
  { material: '珍珠棉片', position: '上下', qty: '2' },
  { material: '珍珠棉片', position: '前后', qty: '2' },
  { material: '珍珠棉片', position: '左右', qty: '2' }
].forEach(function(init){
  addRow('inner', init, '#innerMatList');
});

refresh();
</script>
