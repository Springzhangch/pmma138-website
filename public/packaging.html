<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粤丰包材数量计算器</title>
<style>
  :root{
    --bg:#eef1f5;
    --card:#ffffff;
    --line:#e4e8ee;
    --line-soft:#eef1f6;
    --text:#16191f;
    --sub:#78818e;
    --primary:#009944;
    --primary-soft:#e7f6ec;
    --danger:#e5342c;
    --danger-soft:#fdeeed;
    --warm:#c47f12;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.45;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d9dfe8;border-radius:99px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#c3ccd8;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- 骨架 ---------- */
  .app{
    height:100vh;max-width:1800px;margin:0 auto;
    display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px;
  }
  .grid{
    flex:1;min-height:0;display:grid;gap:10px;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.16fr);
  }
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .card{
    background:var(--card);border:1px solid var(--line-soft);border-radius:14px;
    padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 28px -22px rgba(16,24,40,.18);
    display:flex;flex-direction:column;min-height:0;
  }
  .card.grow{flex:1}
  .card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;margin-bottom:10px;flex:none}
  .card-title i{width:4px;height:14px;border-radius:2px;background:var(--primary);display:block;flex:none}
  .card-title .spacer{flex:1}
  .card-title .hint{font-size:12px;font-weight:400;color:var(--sub)}
  .card-title .flute-tag{
    font-size:11.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);
    padding:1px 8px;border-radius:20px;
  }

  /* ---------- 产品 & PE 袋 ---------- */
  .strip{
    flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:#fff;border:1px solid var(--line-soft);border-radius:14px;
    padding:9px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 28px -22px rgba(16,24,40,.18);
  }
  .strip .st-title{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650;white-space:nowrap}
  .strip .st-title i{width:4px;height:14px;border-radius:2px;background:var(--primary);display:block}
  .st-div{width:1px;align-self:stretch;min-height:26px;background:var(--line);margin:0 1px}
  .prow{display:flex;align-items:center;gap:10px}
  .prow .pf{display:flex;align-items:center;gap:6px}
  .prow .pf label{font-size:13px;color:var(--sub);white-space:nowrap}
  .prow .pf .ipt{width:76px;height:34px;text-align:center;font-weight:600}
  .prow .unit-mm{font-size:12px;color:#a7b0bd;margin-left:-4px}
  .pe{display:flex;align-items:center;gap:7px}
  .pe-tag{
    font-size:11.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);
    padding:4px 9px;border-radius:6px;letter-spacing:.3px;white-space:nowrap;
  }
  .pe-cell{
    display:flex;align-items:baseline;gap:5px;background:#f6faf7;border:1px solid #e2f0e7;
    border-radius:8px;padding:4px 11px;white-space:nowrap;
  }
  .pe-cell span{font-size:11.5px;color:var(--sub)}
  .pe-cell b{font-size:16.5px;font-weight:700;color:var(--primary);line-height:1.15;font-variant-numeric:tabular-nums}
  .pe-cell u{text-decoration:none;font-size:11px;color:var(--sub)}
  .pe-note{
    flex:1 1 200px;min-width:0;margin:0;font-size:11.5px;color:var(--sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:none;display:flex;align-items:center;gap:18px;
    background:#fff;border:1px solid var(--line-soft);border-radius:13px;
    padding:11px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:.2px}
  .topbar .brand em{
    font-style:normal;font-size:11.5px;font-weight:500;color:var(--primary);
    background:var(--primary-soft);padding:2px 8px;border-radius:20px;
  }
  .tb-field{display:flex;align-items:center;gap:8px}
  .tb-field > span{font-size:13.5px;color:var(--sub);white-space:nowrap}
  .tb-field .ipt{width:190px}
  .tb-field .ipt.narrow{width:104px}
  .tb-sum{margin-left:auto;display:flex;align-items:center;gap:10px}
  .tb-item{
    display:flex;align-items:baseline;gap:6px;background:#f6faf7;border:1px solid var(--line-soft);
    border-radius:10px;padding:6px 14px;
  }
  .tb-item span{font-size:13px;color:var(--sub)}
  .tb-item b{font-size:23px;font-weight:700;color:var(--primary);line-height:1.1}
  .tb-item u{text-decoration:none;font-size:12.5px;color:var(--sub)}
  .tb-item.warm b{color:var(--warm)}

  /* ---------- 表单 ---------- */
  .ipt{
    width:100%;height:37px;border:1px solid var(--line);border-radius:8px;
    background:#fafbfc;padding:0 10px;font-size:14px;color:var(--text);
    font-family:inherit;outline:none;transition:.15s;appearance:none;
    font-variant-numeric:tabular-nums;
  }
  .ipt:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(0,153,68,.12)}
  .ipt.over{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);font-weight:700}
  .ipt.qbad{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);font-weight:700}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}

  .row-inline{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .row-inline .lb{font-size:13px;color:var(--sub);white-space:nowrap}
  .seg{display:flex;background:#f1f3f7;border-radius:9px;padding:3px;gap:3px;width:116px;flex:none}
  .seg button{
    flex:1;height:29px;border:0;border-radius:7px;background:transparent;color:var(--sub);
    font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;font-weight:500;padding:0;
  }
  .seg button.on{background:#fff;color:var(--primary);font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.10)}

  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap;margin-left:auto}
  .chk input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;margin:0;flex:none}
  .chk.on{color:var(--primary);font-weight:650}

  /* 排列行 */
  .packrow{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:nowrap}
  .packrow .plb{font-size:12.5px;color:var(--sub);white-space:nowrap;flex:none}
  .packrow .mini{font-size:11.5px;color:#9aa3af;flex:none}
  .packrow .ipt{width:0;flex:1;min-width:34px;height:32px;text-align:center;font-size:13.5px;padding:0 2px}
  .packrow .eq{font-size:12px;color:var(--sub);white-space:nowrap;flex:none;margin-left:2px}
  .packrow .eq b{color:var(--primary);font-size:14.5px;font-weight:700}

  /* 尺寸行 */
  .sizerow{display:flex;align-items:center;gap:5px;margin-bottom:7px}
  .sizerow .plb{font-size:12.5px;color:var(--sub);white-space:nowrap;flex:none;width:52px}
  .sizerow .mini{font-size:11px;color:#9aa3af;flex:none}
  .sizerow .ipt{
    width:0;flex:1;min-width:38px;height:33px;text-align:center;
    font-size:13.5px;font-weight:700;padding:0 2px;background:#fff;
  }
  .sizerow .ipt.manual{border-color:#e6b95c;background:#fffdf4;color:#8a6206}
  .sizerow .reset{
    width:26px;height:33px;flex:none;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:#a3abb7;font-size:13px;cursor:pointer;font-family:inherit;padding:0;line-height:1;
  }
  .sizerow .reset:hover{color:var(--primary);border-color:#a8dcbd;background:#f4fcf7}
  .sizerow .reset.hot{color:#8a6206;border-color:#e6b95c;background:#fffdf4}
  .outdim{
    margin:0;font-size:12px;color:var(--sub);line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .outdim b{color:var(--primary);font-weight:700;font-size:12.5px}
  .outdim .fl{color:#8a6206}

  /* 开关 */
  .switch{position:relative;display:inline-block;width:40px;height:23px;flex:none}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch .slider{position:absolute;inset:0;background:#d7dce4;border-radius:99px;transition:.2s;cursor:pointer}
  .switch .slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked + .slider{background:var(--primary)}
  .switch input:checked + .slider:before{transform:translateX(17px)}

  /* ---------- 物料表 ---------- */
  .mwrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:10px;background:#fff;transition:.18s}
  .mhead,.mrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.95fr) minmax(0,.72fr) minmax(0,.72fr) minmax(0,.56fr) minmax(0,.5fr) 26px;gap:4px;align-items:center}
  #innerMatList,#outerMatList{
    min-height:calc(100% - 33px);
    background:repeating-linear-gradient(to bottom,#fff 0 42px,#dbe3ee 42px 44px);
  }
  .mhead{
    position:sticky;top:0;z-index:2;background:#f6f8fb;padding:7px 8px;
    font-size:12px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line-soft);
  }
  .mrow{padding:5px 8px;border-bottom:1px solid #f4f6fa}
  .mrow:last-child{border-bottom:0}
  .mrow.has-over{background:#fefafa}
  .mrow .ipt{height:33px;padding:0 4px;font-size:13px;text-align:center}
  .mrow select.ipt{padding:0 2px;text-align:left;font-size:12.5px}
  .mrow .icon-btn{
    width:26px;height:29px;border:1px solid var(--line);border-radius:7px;background:#fff;
    color:#a3abb7;font-size:12px;cursor:pointer;font-family:inherit;line-height:1;padding:0;
  }
  .mrow .icon-btn:hover{color:var(--danger);border-color:#f4c8c5;background:#fff7f6}

  /* 无需复杂物料 → 物料区禁用 */
  .disabled-zone .mwrap{opacity:.42;filter:grayscale(1);pointer-events:none;user-select:none}
  .disabled-zone .btn{opacity:.4;pointer-events:none;filter:grayscale(1)}
  .disabled-zone .mhead{background:#f2f4f7}

  .btn{
    margin-top:9px;flex:none;height:34px;width:100%;border:1px dashed #b7dfc6;border-radius:9px;
    background:#f4fcf7;color:var(--primary);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--primary-soft);border-color:var(--primary)}
  .tip{margin:0 0 9px;font-size:12px;color:var(--sub);flex:none;line-height:1.55}
  .tip.warn-tip{color:#b7791f;font-weight:500}
  .tip.danger{color:var(--danger);font-weight:600}
  .empty{font-size:13px;color:#a7b0bd;text-align:center;padding:16px 0}
  #innerMatList:empty,#outerMatList:empty{display:flex;align-items:center;justify-content:center}
  #innerMatList:empty::after,
  #outerMatList:empty::after{
    content:"还没有物料，点下方按钮添加";
    font-size:13px;color:#b6bfca;
  }

  /* ---------- 预览 ---------- */
  .vizrow{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .viz{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#fbfcfe;border:1px solid var(--line-soft);border-radius:11px;padding:5px 7px 5px}
  .viz svg{width:100%;height:100%;min-height:0;display:block;overflow:visible}
  .viz .vhead{
    flex:none;width:100%;font-size:11px;font-weight:700;color:var(--primary);
    letter-spacing:.2px;line-height:1.35;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .viz .vhead.g{color:var(--warm)}
  .viz .vfoot{
    flex:none;width:100%;text-align:center;font-size:10px;color:var(--sub);line-height:1.4;
    white-space:normal;word-break:break-word;
  }
  .viz-empty{font-size:12px;color:#a7b0bd;padding:16px 6px;text-align:center;line-height:1.5}

  /* ---------- 结果 ---------- */
  .note{margin:0 0 7px;font-size:12.5px;color:var(--sub);flex:none;line-height:1.5}
  .note.vbad{color:var(--danger);font-weight:600}
  .note.vok{color:#009944}
  .rlist{flex:1;min-height:0;overflow:auto}
  .li{padding:6px 0;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:7px;flex-wrap:nowrap}
  .li:last-child{border-bottom:0}
  .li .meta{
    font-size:12px;color:var(--sub);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;
  }
  .li .tot{flex:none;font-size:14.5px;font-weight:700;color:var(--primary);white-space:nowrap}
  .li .per{flex:none;font-size:12px;font-weight:600;color:#5c6675;background:#f2f4f7;
           padding:2px 7px;border-radius:5px;white-space:nowrap}
  .li .tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-weight:650;flex:none}
  .li .tag.o{background:#fff3e2;color:var(--warm)}
  .li .tag.p{background:#edf1f7;color:#54637a}
  .li .nm{font-size:13.5px;font-weight:600;white-space:nowrap;flex:none}
  .li .pos{font-size:11px;padding:2px 6px;border-radius:5px;background:#f2f4f7;color:#5c6675;flex:none}
  .li .base{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:700;flex:none}
  .li .base.i{background:#e7f6ec;color:var(--primary)}
  .li .base.o{background:#fff3e2;color:var(--warm)}

  /* ---------- 中等宽度 ---------- */
  @media (max-width:1440px){
    .seg{width:104px}
    .seg button{font-size:12px}
    .prow .pf .ipt{width:64px}
    .chk{font-size:11.5px}
    .sizerow .plb{width:48px;font-size:12px}
    .packrow .plb{font-size:12px}
  }

  /* ---------- 窄屏 ---------- */
  @media (max-width:1180px){
    html,body{height:auto}
    body{overflow:auto}
    .app{height:auto;max-width:none;padding:11px}
    .grid{grid-template-columns:1fr}
    .viz{height:230px}
    .card.grow{flex:none}
    .mwrap{min-height:190px}
    .topbar{flex-wrap:wrap;gap:10px}
    .tb-sum{margin-left:0}
    .strip{gap:10px 12px;padding:10px 13px}
    .pe-note{flex:1 1 100%;white-space:normal}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="brand">粤丰包材数量计算器 <em>产品 → 内箱 → 外箱</em></div>
    <div class="tb-field">
      <span>产品名称</span>
      <input id="pName" class="ipt" type="text" placeholder="选填">
    </div>
    <div class="tb-field">
      <span>产品数量</span>
      <input id="pQty" class="ipt narrow" type="number" inputmode="decimal" min="1" step="1" value="1">
    </div>
    <div class="tb-sum">
      <div class="tb-item"><span>内箱</span><b id="rInner">0</b><u>个</u></div>
      <div class="tb-item warm"><span>外箱</span><b id="rOuter">0</b><u>个</u></div>
    </div>
  </header>

  <!-- ========== 产品 & PE 袋 ========== -->
  <section class="strip">
    <div class="st-title"><i></i>产品 &amp; PE 袋</div>
    <div class="prow">
      <div class="pf"><label>长</label><input id="prodL" class="ipt" type="number" inputmode="decimal" min="0" placeholder="0"></div>
      <div class="pf"><label>宽</label><input id="prodW" class="ipt" type="number" inputmode="decimal" min="0" placeholder="0"></div>
      <div class="pf"><label>高</label><input id="prodH" class="ipt" type="number" inputmode="decimal" min="0" placeholder="0"></div>
      <span class="unit-mm">mm</span>
    </div>
    <div class="st-div"></div>
    <div class="pe">
      <span class="pe-tag">PE 袋</span>
      <div class="pe-cell"><span>袋宽</span><b id="peW">—</b><u>mm</u></div>
      <div class="pe-cell"><span>袋长</span><b id="peL">—</b><u>mm</u></div>
      <div class="pe-cell"><span>数量</span><b id="peQty">0</b><u>个</u></div>
    </div>
    <p class="pe-note" id="peNote"></p>
  </section>

  <div class="grid">

    <!-- ========== 第 1 栏：内箱 ========== -->
    <div class="col">
      <section class="card">
        <div class="card-title"><i></i>内箱<span class="flute-tag" id="innerFluteTag">单坑</span></div>

        <div class="row-inline">
          <span class="lb">坑型</span>
          <div class="seg" id="innerFlute">
            <button type="button" data-val="single">单坑</button>
            <button type="button" data-val="double">双坑</button>
          </div>
          <label class="chk" id="simpleWrap">
            <input type="checkbox" id="innerSimple" checked> 无需复杂内箱物料
          </label>
        </div>

        <div class="packrow">
          <span class="plb">产品排列</span>
          <span class="mini">长</span><input id="ipL" class="ipt" type="number" inputmode="numeric" min="1" step="1" value="1">
          <span class="mini">宽</span><input id="ipW" class="ipt" type="number" inputmode="numeric" min="1" step="1" value="1">
          <span class="mini">高</span><input id="ipH" class="ipt" type="number" inputmode="numeric" min="1" step="1" value="1">
          <span class="eq">= <b id="ipN">1</b> 个/箱</span>
        </div>

        <div class="sizerow">
          <span class="plb">内尺寸</span>
          <span class="mini">长</span><input id="innerL" class="ipt" type="number" inputmode="decimal" min="0">
          <span class="mini">宽</span><input id="innerW" class="ipt" type="number" inputmode="decimal" min="0">
          <span class="mini">高</span><input id="innerH" class="ipt" type="number" inputmode="decimal" min="0">
          <button class="reset" id="resetInner" type="button" title="恢复自动推导">↺</button>
        </div>

        <p class="outdim" id="innerOut">外尺寸 —</p>
      </section>

      <section class="card grow" id="innerMatCard">
        <div class="card-title"><i></i>内箱物料<span class="spacer"></span><span class="hint">尺寸单位 mm</span></div>
        <p class="tip" id="innerLimit"></p>
        <div class="mwrap" id="innerMatWrap">
          <div class="mhead">
            <span>物料</span><span>位置</span><span>长</span><span>宽</span><span>厚</span><span>用量</span><span></span>
          </div>
          <div id="innerMatList"></div>
        </div>
        <button class="btn" id="addInner" type="button">+ 添加内箱物料</button>
      </section>
    </div>

    <!-- ========== 第 2 栏：外箱 ========== -->
    <div class="col">
      <section class="card">
        <div class="card-title">
          <i></i>外箱
          <span class="flute-tag" id="outerFluteTag">双坑</span>
          <span class="spacer"></span>
          <label class="switch"><input type="checkbox" id="outerOn" checked><span class="slider"></span></label>
        </div>

        <div id="outerBody">
          <div class="row-inline">
            <span class="lb">坑型</span>
            <div class="seg" id="outerFlute">
              <button type="button" data-val="single">单坑</button>
              <button type="button" data-val="double">双坑</button>
            </div>
          </div>

          <div class="packrow">
            <span class="plb">内箱排列</span>
            <span class="mini">长</span><input id="opL" class="ipt" type="number" inputmode="numeric" min="1" step="1" value="2">
            <span class="mini">宽</span><input id="opW" class="ipt" type="number" inputmode="numeric" min="1" step="1" value="3">
            <span class="mini">高</span><input id="opH" class="ipt" type="number" inputmode="numeric" min="1" step="1" value="2">
            <span class="eq">= <b id="opN">12</b> 个/箱</span>
          </div>

          <div class="sizerow">
            <span class="plb">内尺寸</span>
            <span class="mini">长</span><input id="outerL" class="ipt" type="number" inputmode="decimal" min="0">
            <span class="mini">宽</span><input id="outerW" class="ipt" type="number" inputmode="decimal" min="0">
            <span class="mini">高</span><input id="outerH" class="ipt" type="number" inputmode="decimal" min="0">
            <button class="reset" id="resetOuter" type="button" title="恢复自动推导">↺</button>
          </div>

          <p class="outdim" id="outerOut">外尺寸 —</p>
          <p class="tip danger" id="outerFitHint" style="display:none;margin:7px 0 0"></p>
        </div>
      </section>

      <section class="card grow" id="outerMatCard">
        <div class="card-title"><i></i>外箱物料<span class="spacer"></span><span class="hint">尺寸单位 mm</span></div>
        <p class="tip" id="outerLimit"></p>
        <div class="mwrap" id="outerMatWrap">
          <div class="mhead">
            <span>物料</span><span>位置</span><span>长</span><span>宽</span><span>厚</span><span>用量</span><span></span>
          </div>
          <div id="outerMatList"></div>
        </div>
        <button class="btn" id="addOuter" type="button">+ 添加外箱物料</button>
      </section>
    </div>

    <!-- ========== 第 3 栏：预览 + 汇总 ========== -->
    <div class="col">
      <section class="card grow" style="flex:.94">
        <div class="card-title"><i></i>箱体外轮廓预览<span class="spacer"></span><span class="hint">外尺寸标注 · mm</span></div>
        <div class="vizrow">
          <div class="viz" id="innerViz"></div>
          <div class="viz" id="outerViz"></div>
        </div>
      </section>

      <section class="card grow" style="flex:1.06">
        <div class="card-title"><i></i>用量汇总<span class="spacer"></span><span class="hint">含箱体与物料</span></div>
        <p class="note" id="rNote"></p>
        <p class="note" id="rVol" style="display:none"></p>
        <div class="rlist" id="rList"></div>
      </section>
    </div>

  </div>
</div>

<script>
/* =========================================================
   常量
   ========================================================= */
var GAP       = 2;      // 单边间隙 mm
var MAT_T     = 18;     // 物料默认厚度 mm
var PAD_SIMPLE= 4;      // 「无需复杂内箱物料」时每边增加量

/* 坑型：前后左右 = side，上下 = top（单边厚度） */
var FLUTE = {
  single: { key:'single', name:'单坑', side:3,   top:5   },
  double: { key:'double', name:'双坑', side:5,   top:7.5 }
};

var MATS = ['珍珠棉片', '保丽龙', '拉伸膜'];
var POS  = ['上', '下', '左', '右', '前', '后', '隔板', '垫片', '上下', '左右', '前后'];
var COMBO= ['上下', '左右', '前后'];

/* 位置 → 影响哪个轴、几层。
   前后 = 宽方向 2 层；左右 = 长方向 2 层；上下 = 高方向 2 层；
   单边位置只算 1 层；隔板 / 垫片不参与尺寸推导。 */
var POS_AXIS = {
  '前后': { axis:'W', n:2 }, '左右': { axis:'L', n:2 }, '上下': { axis:'H', n:2 },
  '前'  : { axis:'W', n:1 }, '后'  : { axis:'W', n:1 },
  '左'  : { axis:'L', n:1 }, '右'  : { axis:'L', n:1 },
  '上'  : { axis:'H', n:1 }, '下'  : { axis:'H', n:1 }
};

/* =========================================================
   状态
   ========================================================= */
var S = {
  product: { L:'', W:'', H:'' },
  inner: {
    flute:'single', simple:true,
    pack:{ L:'1', W:'1', H:'1' },
    mats:[], manual:{ L:null, W:null, H:null }
  },
  outer: {
    on:true, flute:'double',
    pack:{ L:'2', W:'3', H:'2' },
    mats:[], manual:{ L:null, W:null, H:null }
  }
};
var D = null;   // 最近一次推导结果缓存

/* =========================================================
   工具
   ========================================================= */
function $(sel){ return document.querySelector(sel); }
function $$(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : null; }
function val0(x){ var n = num(x); return (n === null || n < 0) ? 0 : n; }
function packNum(v){ var n = Math.round(val0(v)); return n < 1 ? 1 : n; }
function fmt(n){ if(n === null || !isFinite(n)) return '—'; return String(Math.round(n * 100) / 100); }
function fmt0(n){ if(n === null || !isFinite(n)) return ''; return String(Math.round(n * 100) / 100); }
function round1(n){ return Math.round(n * 10) / 10; }
function cbm(L, W, H){ return (L * W * H) / 1000000000; }
function fmt3(n){ return (Math.round(n * 1000) / 1000).toFixed(3); }

/* =========================================================
   核心推导
   ---------------------------------------------------------
   一层包装（内箱 / 外箱）：
     1) base    = 内容物按排列数堆叠后的尺寸
     2) simple  = true → 每边 +4，物料不参与
        否则按「前后 → 左右 → 上下」顺序累加：
          delta = Σ [层数 × (物料厚度 + 间隙)]
          · 前后：宽方向 2 层，影响 W
          · 左右：长方向 2 层，影响 L
          · 上下：高方向 2 层，影响 H
          · 单边位置：1 层
          · 隔板 / 垫片：不影响尺寸
     3) 物料片尺寸在「当前累计尺寸」的快照上生成：
          · 前后片： 长 = 当前L，宽 = 当前H
          · 左右片： 长 = 当前W，宽 = 当前H
          · 上下片： 长 = 当前L，宽 = 当前W
     4) 外尺寸 = 内尺寸 + 坑型厚度（长宽 + side×2，高 + top×2）
   ========================================================= */
function deriveLayer(base, mats, fluteKey, simple, padSimple){
  var fl = FLUTE[fluteKey] || FLUTE.single;
  var cur = { L: base.L, W: base.W, H: base.H };
  var pieces = {};   // item.id -> { L, W }

  if(simple){
    /* 产品未填的轴保持 0，避免空态显示成 4×4×4 */
    if(base.L > 0) cur.L += padSimple;
    if(base.W > 0) cur.W += padSimple;
    if(base.H > 0) cur.H += padSimple;
  }else{
    var g = { L: [], W: [], H: [] };
    mats.forEach(function(it){
      var pa = POS_AXIS[it.data.position];
      if(pa) g[pa.axis].push({ it: it, n: pa.n });
    });
    function delta(axis){
      var d = 0;
      g[axis].forEach(function(r){ d += r.n * (val0(r.it.data.thick) + GAP); });
      return d;
    }
    /* 顺序固定：前后(W) → 左右(L) → 上下(H) */
    cur.W += delta('W');
    g.W.forEach(function(r){ pieces[r.it.id] = { L: cur.L, W: cur.H }; });

    cur.L += delta('L');
    g.L.forEach(function(r){ pieces[r.it.id] = { L: cur.W, W: cur.H }; });

    cur.H += delta('H');
    g.H.forEach(function(r){ pieces[r.it.id] = { L: cur.L, W: cur.W }; });
  }

  var outer = {
    L: cur.L + fl.side * 2,
    W: cur.W + fl.side * 2,
    H: cur.H + fl.top  * 2
  };
  return { inner: cur, outer: outer, fl: fl, pieces: pieces };
}
function applyManual(auto, m){
  return {
    L: (m.L === null ? auto.L : m.L),
    W: (m.W === null ? auto.W : m.W),
    H: (m.H === null ? auto.H : m.H)
  };
}
function deriveAll(){
  var p = S.product;
  var pL = val0(p.L), pW = val0(p.W), pH = val0(p.H);
  var pReady = (pL > 0 && pW > 0 && pH > 0);

  /* --- 内箱 --- */
  var pkI = S.inner.pack;
  var nIL = packNum(pkI.L), nIW = packNum(pkI.W), nIH = packNum(pkI.H);
  var baseI = { L: pL * nIL, W: pW * nIW, H: pH * nIH };
  var dI = deriveLayer(baseI, S.inner.mats, S.inner.flute, S.inner.simple, PAD_SIMPLE);
  var innerIn = applyManual(dI.inner, S.inner.manual);
  var innerOut = {
    L: innerIn.L > 0 ? innerIn.L + dI.fl.side * 2 : 0,
    W: innerIn.W > 0 ? innerIn.W + dI.fl.side * 2 : 0,
    H: innerIn.H > 0 ? innerIn.H + dI.fl.top  * 2 : 0
  };

  /* --- 外箱：以内箱外尺寸为内容物 --- */
  var pkO = S.outer.pack;
  var nOL = packNum(pkO.L), nOW = packNum(pkO.W), nOH = packNum(pkO.H);
  var baseO = { L: innerOut.L * nOL, W: innerOut.W * nOW, H: innerOut.H * nOH };
  var dO = deriveLayer(baseO, S.outer.mats, S.outer.flute, false, 0);
  var outerIn = applyManual(dO.inner, S.outer.manual);
  var outerOut = {
    L: outerIn.L > 0 ? outerIn.L + dO.fl.side * 2 : 0,
    W: outerIn.W > 0 ? outerIn.W + dO.fl.side * 2 : 0,
    H: outerIn.H > 0 ? outerIn.H + dO.fl.top  * 2 : 0
  };

  return {
    pReady: pReady, pL:pL, pW:pW, pH:pH,
    nI: nIL * nIW * nIH, baseI: baseI, dI: dI, innerIn: innerIn, innerOut: innerOut,
    nO: nOL * nOW * nOH, baseO: baseO, dO: dO, outerIn: outerIn, outerOut: outerOut,
    outerPack: { L:nOL, W:nOW, H:nOH }
  };
}

/* =========================================================
   箱体可视化
   ========================================================= */
var VW = 300, VH = 280, PADX = 40, PADY = 26;

function f(n){ return (Math.round(n * 100) / 100).toFixed(2); }
function textW(t){
  var w = 0;
  for(var i = 0; i < t.length; i++){
    var ch = t.charAt(i);
    if(/[\u4e00-\u9fa5]/.test(ch)) w += 12;
    else if(ch === ' ') w += 3.8;
    else w += 6.8;
  }
  return w;
}
function lineEl(p1, p2, stroke, w, dash){
  return '<line x1="' + f(p1[0]) + '" y1="' + f(p1[1]) + '" x2="' + f(p2[0]) + '" y2="' + f(p2[1]) +
         '" stroke="' + stroke + '" stroke-width="' + w + '" stroke-linecap="round"' +
         (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
}
function chip(x, y, text){
  var w = 10 + textW(text), h = 17;
  return '<g><rect x="' + f(x - w / 2) + '" y="' + f(y - h / 2) + '" width="' + f(w) + '" height="' + h +
    '" rx="5" fill="#ffffff" stroke="#d3e7db"/>' +
    '<text x="' + f(x) + '" y="' + f(y) + '" text-anchor="middle" dominant-baseline="central" ' +
    'font-size="12.5" font-weight="700" fill="#009944" font-family="inherit">' + text + '</text></g>';
}
function dimMark(p1, p2, text, cx, cy){
  var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
  var vx = mx - cx, vy = my - cy, len = Math.hypot(vx, vy) || 1, off = 18;
  var a = [p1[0] + vx / len * off, p1[1] + vy / len * off];
  var b = [p2[0] + vx / len * off, p2[1] + vy / len * off];
  var dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1;
  var tx = -dy / dl * 4.5, ty = dx / dl * 4.5;
  var s = '';
  s += lineEl(p1, a, '#d5e4da', 1);
  s += lineEl(p2, b, '#d5e4da', 1);
  s += lineEl(a, b, '#009944', 1.3);
  s += lineEl([a[0] - tx, a[1] - ty], [a[0] + tx, a[1] + ty], '#009944', 1.3);
  s += lineEl([b[0] - tx, b[1] - ty], [b[0] + tx, b[1] + ty], '#009944', 1.3);
  s += chip((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, text);
  return s;
}
/* grid: { L:n, W:n, H:n } 排列网格（外箱用） */
function boxSVG(o, grid){
  var L = o.L, W = o.W, H = o.H;
  if(L <= 0 || W <= 0 || H <= 0) return '';
  var ux = L + 0.5 * W, uy = H + 0.42 * W;
  var sc = Math.min((VW - 2 * PADX) / ux, (VH - 2 * PADY) / uy);
  sc = Math.min(sc, 2.2);
  if(!isFinite(sc) || sc <= 0) sc = 1;
  var ox = (VW - ux * sc) / 2, oy = (VH - uy * sc) / 2;
  function P(x, y, z){ return [ox + (x + 0.5 * y) * sc, oy + uy * sc - (z + 0.42 * y) * sc]; }

  var A = P(0, 0, 0), B = P(L, 0, 0), C = P(L, 0, H), D = P(0, 0, H);
  var E = P(0, W, H), F = P(L, W, H), G = P(L, W, 0);
  var cx = ox + ux * sc / 2, cy = oy + uy * sc / 2;

  var svg = '<svg viewBox="0 0 ' + VW + ' ' + VH + '" preserveAspectRatio="xMidYMid meet">';

  function poly(pts, fill){
    return '<polygon points="' + pts.map(function(p){ return f(p[0]) + ',' + f(p[1]); }).join(' ') +
           '" fill="' + fill + '" stroke="#9fc4ad" stroke-width="1.2" stroke-linejoin="round"/>';
  }
  svg += poly([B, G, F, C], '#e6f3ea');
  svg += poly([D, C, F, E], '#ffffff');
  svg += poly([A, B, C, D], '#f4faf6');

  /* 排列网格：正面（L×H）+ 顶面（L×W）+ 右侧面（W×H） */
  if(grid){
    var gc = '#a9cbb9', gd = '3 3', gw = 0.8;
    var i, j, x, z, y;
    for(i = 1; i < grid.L; i++){
      x = L * i / grid.L;
      svg += lineEl(P(x, 0, 0), P(x, 0, H), gc, gw, gd);
      svg += lineEl(P(x, 0, H), P(x, W, H), gc, gw, gd);
    }
    for(j = 1; j < grid.H; j++){
      z = H * j / grid.H;
      svg += lineEl(P(0, 0, z), P(L, 0, z), gc, gw, gd);
      svg += lineEl(P(L, 0, z), P(L, W, z), gc, gw, gd);
    }
    for(j = 1; j < grid.W; j++){
      y = W * j / grid.W;
      svg += lineEl(P(0, y, H), P(L, y, H), gc, gw, gd);
      svg += lineEl(P(L, y, 0), P(L, y, H), gc, gw, gd);
    }
  }

  svg += dimMark(A, B, '长 ' + fmt(L) + 'mm', cx, cy);
  svg += dimMark(D, A, '高 ' + fmt(H) + 'mm', cx, cy);
  svg += dimMark(C, F, '宽 ' + fmt(W) + 'mm', cx, cy);
  svg += '</svg>';
  return svg;
}

/* =========================================================
   渲染
   ========================================================= */
function fluteText(fl, withName){
  return (withName ? fl.name + '（' : '') + '前后左右 ' + fmt(fl.side) + ' / 上下 ' + fmt(fl.top) + (withName ? '）' : '');
}
function renderViz(sel, outer, label, cls, grid, foot){
  var host = $(sel);
  var head = '<div class="vhead ' + (cls || '') + '">' + label + '</div>';
  if(!outer || outer.L <= 0 || outer.W <= 0 || outer.H <= 0){
    host.innerHTML = head + '<div class="viz-empty">填写产品长宽高后自动显示</div>';
    return;
  }
  host.innerHTML = head + boxSVG(outer, grid) + '<div class="vfoot">' + foot + '</div>';
}
function renderLimit(sel, inner, fl, simple){
  var el = $(sel);
  var lim = Math.max(inner.L, inner.W, inner.H);
  if(lim <= 0){
    el.textContent = simple ? '填写产品尺寸后自动生成内尺寸' : '内尺寸为 0 → 物料填入任一尺寸都会标红';
    el.className = 'tip warn-tip';
    return;
  }
  el.className = 'tip';
  if(simple){
    el.textContent = '无需复杂物料：内尺寸 = 产品 + ' + PAD_SIMPLE + 'mm　·　物料区已锁定，汇总改列 PE 袋';
  }else{
    el.textContent = '内尺寸 ' + fmt(inner.L) + ' × ' + fmt(inner.W) + ' × ' + fmt(inner.H) +
      '　·　判定上限 ' + fmt(lim) + 'mm';
  }
}

/* =========================================================
   PE 袋（只算产品的 PE 袋）
   宽 ≤ 20：袋宽 = 长 + 宽 + 20 ；袋长 = 高 + 宽 + 20
   宽 >  20：袋宽 = 长 + 宽 + 宽/2 ；袋长 = 高 + 宽 + 宽/2 + 30
   ========================================================= */
function peOf(){
  var L = val0(S.product.L), W = val0(S.product.W), H = val0(S.product.H);
  if(L <= 0 || W <= 0 || H <= 0) return null;
  var thin = W <= 20;
  var extra = thin ? 0 : W / 2;
  return {
    thin: thin, L: L, W: W, H: H, half: W / 2,
    bagW: L + W + extra + (thin ? 20 : 0),
    bagL: H + W + extra + (thin ? 20 : 30)
  };
}
function renderPE(){
  var wEl = $('#peW'), lEl = $('#peL'), qEl = $('#peQty'), nEl = $('#peNote');
  var pq = num($('#pQty').value);
  pq = pq === null ? 0 : Math.max(0, Math.round(pq));

  var p = peOf();
  if(!p){
    wEl.textContent = '—'; lEl.textContent = '—'; qEl.textContent = '0';
    nEl.textContent = '填写产品长、宽、高后自动计算 PE 袋规格';
    nEl.title = '';
    return;
  }
  wEl.textContent = fmt(p.bagW);
  lEl.textContent = fmt(p.bagL);
  qEl.textContent = fmt(pq);

  var note, full;
  if(p.thin){
    note = '袋宽 ' + fmt(p.L) + '+' + fmt(p.W) + '+20=' + fmt(p.bagW) +
           '　·　袋长 ' + fmt(p.H) + '+' + fmt(p.W) + '+20=' + fmt(p.bagL);
    full = '宽 ' + fmt(p.W) + ' ≤ 20，走「+20」档\n' +
           '袋宽 = 长 ' + fmt(p.L) + ' + 宽 ' + fmt(p.W) + ' + 20 = ' + fmt(p.bagW) + ' mm\n' +
           '袋长 = 高 ' + fmt(p.H) + ' + 宽 ' + fmt(p.W) + ' + 20 = ' + fmt(p.bagL) + ' mm';
  }else{
    note = '袋宽 ' + fmt(p.L) + '+' + fmt(p.W) + '+' + fmt(p.half) + '=' + fmt(p.bagW) +
           '　·　袋长 ' + fmt(p.H) + '+' + fmt(p.W) + '+' + fmt(p.half) + '+30=' + fmt(p.bagL);
    full = '宽 ' + fmt(p.W) + ' > 20，走「+宽/2」档（宽/2 = ' + fmt(p.half) + '）\n' +
           '袋宽 = 长 ' + fmt(p.L) + ' + 宽 ' + fmt(p.W) + ' + ' + fmt(p.half) + ' = ' + fmt(p.bagW) + ' mm\n' +
           '袋长 = 高 ' + fmt(p.H) + ' + 宽 ' + fmt(p.W) + ' + ' + fmt(p.half) + ' + 30 = ' + fmt(p.bagL) + ' mm';
  }
  if(Math.abs(p.bagW - Math.round(p.bagW)) > 1e-9 || Math.abs(p.bagL - Math.round(p.bagL)) > 1e-9){
    full += '\n整数规格取整：' + Math.ceil(p.bagW) + ' × ' + Math.ceil(p.bagL) + ' mm';
  }
  nEl.textContent = note;
  nEl.title = full;
}

/* =========================================================
   物料行
   ========================================================= */
var SEQ = 0;
function makeRow(kind, init){
  var data = { material:'珍珠棉片', position:'前后', L:'', W:'', thick:String(MAT_T), qty:'2' };
  if(init) for(var k in init) if(init.hasOwnProperty(k)) data[k] = init[k];

  var el = document.createElement('div');
  el.className = 'mrow';
  el.innerHTML =
    '<select class="ipt" data-f="material">' +
      MATS.map(function(m){ return '<option value="' + m + '">' + m + '</option>'; }).join('') +
    '</select>' +
    '<select class="ipt" data-f="position">' +
      POS.map(function(p){ return '<option value="' + p + '">' + p + '</option>'; }).join('') +
    '</select>' +
    '<input class="ipt" type="number" inputmode="decimal" data-f="L">' +
    '<input class="ipt" type="number" inputmode="decimal" data-f="W">' +
    '<input class="ipt" type="number" inputmode="decimal" data-f="thick">' +
    '<input class="ipt" type="number" inputmode="numeric" data-f="qty">' +
    '<button type="button" class="icon-btn" data-f="del" title="删除该物料">✕</button>';

  function q(field){ return el.querySelector('[data-f="' + field + '"]'); }
  function isCombo(){ return COMBO.indexOf(data.position) >= 0; }
  function fixedQty(){
    var v = num(data.qty);
    if(isCombo()){
      if(v === null || v < 2) return 2;
      return Math.ceil(v / 2) * 2;
    }
    if(v === null || v < 1) return 1;
    return Math.floor(v);
  }
  function applyQtyUI(force){
    var inp = q('qty'), c = isCombo();
    inp.setAttribute('min', c ? '2' : '1');
    inp.setAttribute('step', c ? '2' : '1');
    inp.title = c ? '组合位置（上下/左右/前后）：数量须为 2 或 2 的倍数' : '单件位置：数量可填任意整数（≥1）';
    var v = num(data.qty);
    var bad = c && (v === null || v < 2 || Math.abs(v / 2 - Math.round(v / 2)) > 1e-9);
    if(force && bad){
      var s = String(fixedQty());
      inp.value = s; data.qty = s; bad = false;
    }
    inp.classList.toggle('qbad', bad);
  }

  q('material').value = data.material;
  q('position').value = data.position;
  q('L').value = data.L;
  q('W').value = data.W;
  q('thick').value = data.thick;
  q('qty').value = data.qty;
  applyQtyUI(false);

  var item = { id: ++SEQ, data: data, el: el, fixedQty: fixedQty, autoL: true, autoW: true };

  ['material', 'position', 'thick', 'qty'].forEach(function(field){
    var node = q(field);
    function sync(){
      data[field] = node.value;
      if(field === 'position') applyQtyUI(true);
      if(field === 'qty') applyQtyUI(false);
      refresh();
    }
    node.addEventListener('input', sync);
    node.addEventListener('change', sync);
  });
  q('qty').addEventListener('blur', function(){ applyQtyUI(true); refresh(); });

  /* 长 / 宽：用户改动后锁定，不再跟随自动推导 */
  ['L', 'W'].forEach(function(field){
    var node = q(field);
    node.addEventListener('input', function(){
      data[field] = node.value;
      if(field === 'L') item.autoL = (node.value === '');
      else              item.autoW = (node.value === '');
      refresh();
    });
  });

  q('del').addEventListener('click', function(){
    var arr = (kind === 'inner') ? S.inner.mats : S.outer.mats;
    var i = arr.indexOf(item);
    if(i > -1) arr.splice(i, 1);
    if(el.parentNode) el.parentNode.removeChild(el);
    refresh();
  });
  return item;
}
/* 新行默认位置：按 前后 → 左右 → 上下 依次补位，避免连续添加全堆在一个方向 */
function nextPos(kind){
  var arr = (kind === 'inner') ? S.inner.mats : S.outer.mats;
  var used = arr.map(function(it){ return it.data.position; });
  var order = COMBO;                       // ['上下','左右','前后']
  var seq = ['前后', '左右', '上下'];
  for(var i = 0; i < seq.length; i++){
    if(used.indexOf(seq[i]) < 0) return seq[i];
  }
  return seq[used.length % seq.length];
}
function addRow(kind, init, targetId){
  if(!init) init = { position: nextPos(kind) };
  var item = makeRow(kind, init);
  ((kind === 'inner') ? S.inner.mats : S.outer.mats).push(item);
  $(targetId).appendChild(item.el);
  return item;
}
/* 物料任一尺寸 > 箱体内尺寸最大值 → 该数字标红 */
function validate(item, limit){
  var over = false;
  ['L', 'W', 'thick'].forEach(function(field){
    var inp = item.el.querySelector('[data-f="' + field + '"]');
    var v = num(item.data[field]);
    var bad = (v !== null && v > limit + 1e-6);
    inp.classList.toggle('over', bad);
    if(bad) over = true;
  });
  item.el.classList.toggle('has-over', over);
}
/* 自动生成的片尺寸写回输入框（不动用户手动改过的） */
function syncPieces(items, pieces){
  items.forEach(function(it){
    var p = pieces[it.id];
    if(!p) return;
    if(it.autoL){
      var v = fmt0(p.L);
      if(it.data.L !== v){
        it.data.L = v;
        var el = it.el.querySelector('[data-f="L"]');
        if(document.activeElement !== el) el.value = v;
      }
    }
    if(it.autoW){
      var w = fmt0(p.W);
      if(it.data.W !== w){
        it.data.W = w;
        var el2 = it.el.querySelector('[data-f="W"]');
        if(document.activeElement !== el2) el2.value = w;
      }
    }
  });
}

/* =========================================================
   尺寸输入框同步
   ========================================================= */
function syncSizes(){
  var A = D;

  /* 内箱 */
  ['L', 'W', 'H'].forEach(function(k){
    var el = document.getElementById('inner' + k);
    var auto = A.innerIn[k];
    var man = S.inner.manual[k];
    var show = (man === null ? auto : man);
    if(document.activeElement !== el) el.value = fmt0(show);
    el.classList.toggle('manual', man !== null);
  });
  $('#resetInner').classList.toggle('hot', S.inner.manual.L !== null || S.inner.manual.W !== null || S.inner.manual.H !== null);

  /* 外箱 */
  ['L', 'W', 'H'].forEach(function(k){
    var el = document.getElementById('outer' + k);
    var auto = A.outerIn[k];
    var man = S.outer.manual[k];
    var show = (man === null ? auto : man);
    if(document.activeElement !== el) el.value = fmt0(show);
    el.classList.toggle('manual', man !== null);
  });
  $('#resetOuter').classList.toggle('hot', S.outer.manual.L !== null || S.outer.manual.W !== null || S.outer.manual.H !== null);
}

/* =========================================================
   数量与汇总
   ========================================================= */
function renderResults(){
  var A = D;
  var pq = num($('#pQty').value);
  pq = pq === null ? 0 : Math.max(0, Math.round(pq));

  var perUnit = A.nI;                        // 每内箱装产品数 = 排列乘积
  var perBox  = A.nO;                        // 每外箱装内箱数 = 排列乘积

  var rawInner = 0, innerCount = 0;
  if(perUnit > 0 && pq > 0){
    rawInner = pq / perUnit;
    innerCount = Math.ceil(rawInner);
  }

  var on = S.outer.on;
  var raw = 0, outerCount = 0;
  if(on && perBox > 0 && innerCount > 0){
    raw = innerCount / perBox;
    outerCount = Math.ceil(raw);
  }

  $('#rInner').textContent = innerCount;
  $('#rOuter').textContent = on ? outerCount : 0;
  $('#ipN').textContent = A.nI;
  $('#opN').textContent = A.nO;

  /* 换算说明 */
  var step1 = (pq > 0 && perUnit > 0)
    ? pq + ' 产品 ÷ 每内箱 ' + perUnit + ' = ' + fmt(round1(rawInner)) + ' → ' + innerCount + ' 个内箱'
    : '请填写产品数量';
  var step2 = '';
  if(on){
    if(innerCount > 0) step2 = '　｜　' + innerCount + ' ÷ 每外箱 ' + perBox + ' = ' + fmt(round1(raw)) + ' → ' + outerCount + ' 个外箱';
  }else{
    step2 = '　｜　未勾选外箱';
  }
  $('#rNote').textContent = step1 + step2;

  /* 体积核对（外箱内腔 vs 排进去的内箱外形） */
  var volEl = $('#rVol');
  var vNeed = cbm(A.innerOut.L, A.innerOut.W, A.innerOut.H) * perBox;
  var vHas  = cbm(A.outerIn.L, A.outerIn.W, A.outerIn.H);
  if(!on || innerCount <= 0 || A.innerOut.L <= 0){
    volEl.style.display = 'none';
  }else{
    volEl.style.display = '';
    var bad = vNeed > vHas + 1e-9;
    volEl.className = bad ? 'note vbad' : 'note vok';
    volEl.textContent = '每外箱需容纳 ' + perBox + ' 个内箱 = ' + fmt3(vNeed) +
      ' m³ ｜ 外箱内腔 ' + fmt3(vHas) + ' m³ ｜ 占用 ' + fmt((vHas > 0 ? vNeed / vHas * 100 : 0)) + '%' +
      (bad ? '　⚠ 装不下' : '　✓ 可容纳');
  }

  /* 基数：该箱对应多少个产品 */
  var bIn = perUnit;
  var bOut = perUnit * perBox;
  var bInTip = '1 个内箱 = ' + perUnit + ' 个产品';
  var bOutTip = '1 个外箱 = ' + perBox + ' 个内箱 × 每箱 ' + perUnit + ' 个产品 = ' + bOut + ' 个产品';

  var html = '';
  if(A.innerIn.L <= 0){
    $('#rList').innerHTML = '<div class="empty" style="padding:26px 0">填写产品长、宽、高后，自动生成箱体与物料清单</div>';
    return;
  }
  html += boxHTML('内箱本体', '内箱', '', A.innerIn, A.innerOut, A.dI.fl, innerCount, bIn, 'i', bInTip);
  /* 无需复杂内箱物料：内箱只有产品 + PE 袋，汇总改列 PE 袋规格与数量 */
  if(S.inner.simple){
    html += peItemHTML(pq, perUnit, bIn, 'i', bInTip);
  }else{
    html += matHTML(S.inner.mats, innerCount, '内箱', '', A.innerIn, bIn, 'i', bInTip);
  }
  if(on){
    html += boxHTML('外箱本体', '外箱', ' o', A.outerIn, A.outerOut, A.dO.fl, outerCount, bOut, 'o', bOutTip);
    html += matHTML(S.outer.mats, outerCount, '外箱', ' o', A.outerIn, bOut, 'o', bOutTip);
  }
  $('#rList').innerHTML = html;
}
function boxHTML(name, tagText, tagCls, inner, outer, fl, count, base, bCls, bTip){
  var meta = '外尺寸 ' + fmt(outer.L) + ' × ' + fmt(outer.W) + ' × ' + fmt(outer.H) + ' mm　·　' + fl.name;
  return '<div class="li" title="' + fluteText(fl, true) + '">' +
    '<span class="tag' + tagCls + '">' + tagText + '</span>' +
    '<span class="nm">' + name + '</span>' +
    '<span class="meta">' + meta + '</span>' +
    '<span class="tot">总数 ' + fmt(count) + '</span>' +
    '<span class="base ' + bCls + '"' + (bTip ? ' title="' + bTip + '"' : '') + '>基数 ' + (base > 0 ? base : '—') + '</span>' +
  '</div>';
}
function matHTML(items, boxCount, tagText, tagCls, inner, base, bCls, bTip){
  if(!items.length) return '<div class="empty">' + tagText + '未添加物料</div>';
  var limit = Math.max(inner.L, inner.W, inner.H);

  return items.map(function(item){
    var d = item.data;
    var emptySize = (num(d.L) === null && num(d.W) === null && num(d.thick) === null);
    var over = false;
    ['L', 'W', 'thick'].forEach(function(k){
      var v = num(d[k]);
      if(v !== null && v > limit + 1e-6) over = true;
    });
    var sizeTxt = emptySize
      ? '尺寸待填'
      : [d.L, d.W, d.thick].map(function(v){ return num(v) === null ? '—' : fmt(num(v)); }).join(' × ') + ' mm';
    var per = item.fixedQty();
    var meta = sizeTxt + (over ? '　⚠ 超出箱体内部空间' : '');

    return '<div class="li">' +
      '<span class="tag' + tagCls + '">' + tagText + '</span>' +
      '<span class="nm">' + d.material + '</span>' +
      '<span class="pos">' + d.position + '</span>' +
      '<span class="meta"' + (over ? ' style="color:var(--danger);font-weight:600"' : '') + '>' + meta + '</span>' +
      '<span class="tot">总数 ' + fmt(per * boxCount) + '</span>' +
      '<span class="per">单箱数量 ' + per + '</span>' +
      '<span class="base ' + bCls + '"' + (bTip ? ' title="' + bTip + '"' : '') + '>基数 ' + (base > 0 ? base : '—') + '</span>' +
    '</div>';
  }).join('');
}
/* 无需复杂内箱物料 → 汇总里用 PE 袋替代内箱物料行 */
function peItemHTML(pq, perUnit, base, bCls, bTip){
  var p = peOf();
  if(!p){
    return '<div class="li">' +
      '<span class="tag p">PE袋</span>' +
      '<span class="nm">PE 袋</span>' +
      '<span class="meta">填写产品长宽高后自动生成袋子规格</span>' +
    '</div>';
  }
  var full = (p.thin ? '宽 ' + fmt(p.W) + ' ≤ 20，走「+20」档' : '宽 ' + fmt(p.W) + ' > 20，走「+宽/2」档') + '\n' +
             '袋宽 = 长 ' + fmt(p.L) + ' + 宽 ' + fmt(p.W) + (p.thin ? ' + 20' : ' + ' + fmt(p.half)) +
             ' = ' + fmt(p.bagW) + ' mm\n' +
             '袋长 = 高 ' + fmt(p.H) + ' + 宽 ' + fmt(p.W) + (p.thin ? ' + 20' : ' + ' + fmt(p.half) + ' + 30') +
             ' = ' + fmt(p.bagL) + ' mm\n' +
             '数量 = 产品数量 ' + fmt(pq) + ' 个（1 件 1 袋）\n' +
             '勾选「无需复杂内箱物料」时，内箱不另计内衬物料';

  return '<div class="li" title="' + full + '">' +
    '<span class="tag p">PE袋</span>' +
    '<span class="nm">PE 袋</span>' +
    '<span class="meta">袋宽 ' + fmt(p.bagW) + ' × 袋长 ' + fmt(p.bagL) + ' mm</span>' +
    '<span class="tot">总数 ' + fmt(pq) + '</span>' +
    '<span class="per">单箱数量 ' + perUnit + '</span>' +
    '<span class="base ' + bCls + '"' + (bTip ? ' title="' + bTip + '"' : '') + '>基数 ' + (base > 0 ? base : '—') + '</span>' +
  '</div>';
}

/* =========================================================
   刷新
   ========================================================= */
function refresh(){
  D = deriveAll();
  var A = D;
  var on = S.outer.on;

  /* 内箱物料区锁定 */
  $('#innerMatCard').classList.toggle('disabled-zone', S.inner.simple);
  $('#innerSimple').checked = S.inner.simple;
  $('#simpleWrap').classList.toggle('on', S.inner.simple);

  /* 物料片尺寸自动生成 */
  syncPieces(S.inner.mats, A.dI.pieces);
  if(on) syncPieces(S.outer.mats, A.dO.pieces);

  /* 尺寸框 */
  syncSizes();

  /* 外尺寸文本 */
  $('#innerFluteTag').textContent = A.dI.fl.name;
  $('#outerFluteTag').textContent = A.dO.fl.name;
  $('#innerOut').innerHTML = A.pReady
    ? '外尺寸 <b>' + fmt(A.innerOut.L) + ' × ' + fmt(A.innerOut.W) + ' × ' + fmt(A.innerOut.H) + '</b> mm　·　<span class="fl">' + fluteText(A.dI.fl, true) + '</span>'
    : '外尺寸 —　·　填写产品尺寸后自动推导';
  $('#outerOut').innerHTML = A.innerOut.L > 0
    ? '外尺寸 <b>' + fmt(A.outerOut.L) + ' × ' + fmt(A.outerOut.W) + ' × ' + fmt(A.outerOut.H) + '</b> mm　·　<span class="fl">' + fluteText(A.dO.fl, true) + '</span>'
    : '外尺寸 —';

  /* 预览 */
  renderViz('#innerViz', A.innerOut, '内箱 · ' + A.dI.fl.name, '',
    packGridInner(),
    '内 ' + fmt(A.innerIn.L) + '×' + fmt(A.innerIn.W) + '×' + fmt(A.innerIn.H) +
    ' → 外 ' + fmt(A.innerOut.L) + '×' + fmt(A.innerOut.W) + '×' + fmt(A.innerOut.H));
  renderViz('#outerViz', A.outerOut, '外箱 · ' + A.dO.fl.name + ' · 排列 ' + A.outerPack.L + '×' + A.outerPack.W + '×' + A.outerPack.H, 'g',
    S.outer.on ? A.outerPack : null,
    '内 ' + fmt(A.outerIn.L) + '×' + fmt(A.outerIn.W) + '×' + fmt(A.outerIn.H) +
    ' → 外 ' + fmt(A.outerOut.L) + '×' + fmt(A.outerOut.W) + '×' + fmt(A.outerOut.H));

  /* 上限提示 */
  renderLimit('#innerLimit', A.innerIn, A.dI.fl, S.inner.simple);

  /* 物料校验 */
  var li = Math.max(A.innerIn.L, A.innerIn.W, A.innerIn.H);
  S.inner.mats.forEach(function(it){ validate(it, li); });

  $('#outerBody').style.display = on ? '' : 'none';
  $('#outerMatCard').style.display = on ? '' : 'none';
  $('#outerViz').style.display = on ? '' : 'none';

  if(on){
    renderLimit('#outerLimit', A.outerIn, A.dO.fl, false);
    var lo = Math.max(A.outerIn.L, A.outerIn.W, A.outerIn.H);
    S.outer.mats.forEach(function(it){ validate(it, lo); });
    checkFit();
  }

  renderPE();
  renderResults();
}

/* 内箱排列网格（仅当产品排列 > 1 时画） */
function packGridInner(){
  var p = S.inner.pack;
  var g = { L: packNum(p.L), W: packNum(p.W), H: packNum(p.H) };
  if(g.L === 1 && g.W === 1 && g.H === 1) return null;
  return g;
}

/* 手动覆盖导致装不下时的提示 */
var NAMES = { L:'长', W:'宽', H:'高' };
function checkFit(){
  var A = D, hint = $('#outerFitHint');
  if(!S.outer.on){ hint.style.display = 'none'; return; }

  var bad = [], any = false;
  ['L', 'W', 'H'].forEach(function(k){
    var need = A.innerOut[k] * (k === 'L' ? A.outerPack.L : k === 'W' ? A.outerPack.W : A.outerPack.H);
    if(A.outerIn[k] + 1e-6 < need){
      bad.push(NAMES[k] + '：需 ' + fmt(need) + ' > 内腔 ' + fmt(A.outerIn[k]));
      any = true;
    }
  });
  if(any){
    hint.style.display = '';
    hint.innerHTML = '⚠ 内箱排不进外箱（手动改动内尺寸导致）→ ' + bad.join('　｜　') + '（mm）';
  }else{
    hint.style.display = 'none';
    hint.innerHTML = '';
  }
}

/* =========================================================
   绑定
   ========================================================= */
function bindDim(ids, obj, isManual, keys){
  keys.forEach(function(k){
    var el = document.getElementById(ids + k);
    el.addEventListener('input', function(){
      var v = el.value.trim();
      if(isManual){
        var n = num(v);
        obj[k] = (v === '' || n === null || n <= 0) ? null : n;
      }else{
        obj[k] = v;
      }
      refresh();
    });
    el.addEventListener('blur', function(){
      if(isManual){
        var n = num(el.value);
        obj[k] = (el.value.trim() === '' || n === null || n <= 0) ? null : n;
        refresh();
      }
    });
  });
}
function bindPack(ids, pack){
  ['L', 'W', 'H'].forEach(function(k){
    var el = document.getElementById(ids + k);
    el.value = pack[k];
    el.addEventListener('input', function(){
      pack[k] = el.value;
      refresh();
    });
    el.addEventListener('blur', function(){
      var v = String(packNum(el.value));
      el.value = v; pack[k] = v;
      refresh();
    });
  });
}
function bindSeg(sel, box){
  var buttons = $$(sel + ' button');
  function paint(){
    buttons.forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-val') === box.flute); });
  }
  buttons.forEach(function(b){
    b.addEventListener('click', function(){ box.flute = b.getAttribute('data-val'); paint(); refresh(); });
  });
  paint();
}

/* 产品尺寸 */
['L', 'W', 'H'].forEach(function(k){
  var el = document.getElementById('prod' + k);
  el.value = S.product[k];
  el.addEventListener('input', function(){ S.product[k] = el.value; refresh(); });
});

/* 内箱 / 外箱 内尺寸（可手动覆盖） */
bindDim('inner', S.inner.manual, true, ['L', 'W', 'H']);
bindDim('outer', S.outer.manual, true, ['L', 'W', 'H']);

/* 排列 */
bindPack('ip', S.inner.pack);
bindPack('op', S.outer.pack);

/* 坑型 */
bindSeg('#innerFlute', S.inner);
bindSeg('#outerFlute', S.outer);

/* 无需复杂内箱物料 */
$('#innerSimple').addEventListener('change', function(){
  S.inner.simple = this.checked;
  refresh();
});

/* 恢复自动 */
function resetManual(box){
  box.manual = { L:null, W:null, H:null };
  refresh();
}
$('#resetInner').addEventListener('click', function(){ resetManual(S.inner); });
$('#resetOuter').addEventListener('click', function(){ resetManual(S.outer); });

/* 外箱开关 */
$('#outerOn').addEventListener('change', function(){ S.outer.on = this.checked; refresh(); });

/* 产品数量 */
$('#pQty').addEventListener('input', refresh);

/* 添加物料 */
$('#addInner').addEventListener('click', function(){ addRow('inner', null, '#innerMatList'); refresh(); });
$('#addOuter').addEventListener('click', function(){ addRow('outer', null, '#outerMatList'); refresh(); });

/* 启动 */
refresh();
</script>
