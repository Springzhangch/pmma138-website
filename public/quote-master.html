<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>内部工具</title>
<style>
  :root{--pri:#009944;--bg:#eef1f5;--line:#e4e8ee;--text:#16191f;--sub:#78818e;--danger:#e5342c}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
  .gate{width:100%;max-width:368px;background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:28px 24px 20px;text-align:center;
    box-shadow:0 2px 4px rgba(16,24,40,.04),0 24px 48px -32px rgba(16,24,40,.28)}
  .lock{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:#e7f6ec;display:flex;align-items:center;justify-content:center}
  h1{font-size:17px;margin:0 0 6px;font-weight:650;letter-spacing:.2px}
  p.tip{font-size:12.5px;color:var(--sub);margin:0 0 16px}
  input[type=password]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;
    font-size:15px;outline:none;transition:.15s;background:#fbfcfd;letter-spacing:.4px}
  input[type=password]:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(0,153,68,.12)}
  button{width:100%;height:42px;margin-top:10px;border:0;border-radius:10px;background:var(--pri);color:#fff;
    font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s}
  button:hover{background:#00803a}
  button:disabled{opacity:.6;cursor:default}
  .err{font-size:12.5px;color:var(--danger);min-height:18px;margin-top:9px;font-weight:500}
  .row{display:flex;align-items:center;gap:6px;margin-top:11px;font-size:12px;color:var(--sub);justify-content:center}
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--pri)}
  .foot{margin-top:14px;font-size:11px;color:#a3abb7;letter-spacing:.3px}
  .boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--sub);z-index:9}
</style>
</head>
<body>
<div class="boot" id="boot">正在识别网络…</div>
<form class="gate" id="gate" autocomplete="off" style="display:none">
  <div class="lock">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#009944" stroke-width="2" stroke-linecap="round">
      <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </svg>
  </div>
  <h1>内部工具</h1>
  <p class="tip">当前网络未授权，请输入访问密码</p>
  <input type="password" id="pw" placeholder="访问密码" autocomplete="current-password">
  <div class="row"><input type="checkbox" id="rm" checked><label for="rm">在此设备记住密码</label></div>
  <button type="submit" id="btn">进入</button>
  <div class="err" id="err"></div>
  <div class="foot">仅限授权人员使用</div>
</form>

<script>
(function(){
  var GATE_URL = "https://GATE-ENDPOINT-HERE/gate";
  var WA_IV="vNNpdrCx/aaixNpB", WA_CT="JKQGoRDuayARsdyI4kI48J507QUKPp1GKxjA2A/Eu1Zfgz9WmFn80YcJLhAycSf9";
  var WB_IV="TQM9ZiKTyG3V7g7+", WB_CT="fSrjeJmyszT2IiF/W1LIyKXgu/s70hCMY1tVQEoXe2FbmJ4rI2bs5iJ2SNA46oGQ";
  var SALT="iKzocQZuDDw7b1PtwvPBaw==", ITER=600000, KEY="gate:dbbdb92e";
  var BODY_IV = document.getElementById('b').getAttribute('data-iv');
  var BODY_CT = document.getElementById('b').textContent.trim();
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function $(i){return document.getElementById(i);}
  var boot=$('boot'), form=$('gate'), pw=$('pw'), btn=$('btn'), err=$('err'), done=false;
  function msg(t){err.textContent=t||'';}
  function dec(key, iv, ct){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(iv)}, key, b64(ct)); }
  function render(dekBuf){
    if(done) return Promise.reject('already');
    return crypto.subtle.importKey('raw', dekBuf, {name:'AES-GCM'}, false, ['decrypt'])
      .then(function(dek){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BODY_IV)}, dek, b64(BODY_CT));
      })
      .then(function(buf){
        done=true;
        document.open(); document.write(new TextDecoder().decode(buf)); document.close();
      });
  }
  function tryNetwork(){
    if(!GATE_URL || GATE_URL.indexOf('GATE-ENDPOINT-HERE')>=0) return Promise.reject('no-gate');
    var ctl = new AbortController();
    var t = setTimeout(function(){ ctl.abort(); }, 1800);
    return fetch(GATE_URL, {mode:'cors', cache:'no-store', signal:ctl.signal})
      .then(function(r){ return r.json(); })
      .then(function(j){
        clearTimeout(t);
        if(!j || j.ok !== 1 || !j.k) throw 'not-allowed';
        return crypto.subtle.importKey('raw', b64(j.k), {name:'AES-GCM'}, false, ['decrypt']);
      })
      .then(function(k){ return dec(k, WA_IV, WA_CT); })
      .then(function(dek){ return render(dek); });
  }
  function askPassword(){
    if(done) return;
    boot.style.display='none'; form.style.display='';
    var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
    if(saved){ pw.value=saved; unlock(saved); } else { pw.focus(); }
  }
  function unlock(p){
    if(done) return;
    btn.disabled=true; msg('正在验证…');
    var enc=new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(p.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'}, base,
        {name:'AES-GCM',length:256}, false, ['decrypt']);
    }).then(function(kp){
      return dec(kp, WB_IV, WB_CT);
    }).then(function(dek){
      try{ if($('rm').checked) localStorage.setItem(KEY, p); }catch(e){}
      return render(dek);
    }).catch(function(){
      btn.disabled=false; msg('密码不正确，请重试'); pw.value=''; pw.focus();
    });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!pw.value){ msg('请输入密码'); return; }
    unlock(pw.value);
  });
  tryNetwork().catch(function(){ askPassword(); });
})();
</script>
