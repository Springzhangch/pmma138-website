                                   '　距台阶 ', { k: 'lower.frontFrom', v: fmt(p.frontFrom) },
                                   '　台阶高 ', { k: 'lower.neckTopH', v: fmt(p.neckTopH) }], 'sm');
    d.add(dC.o);
  }

  /* 方向提示 */
  const dy = r.y + r.h - 13, x1 = r.x + 34, x2 = r.x + 140;
  d.add(`<line class="dim" x1="${x1}" y1="${dy}" x2="${x2}" y2="${dy}"/>`);
  d.arrow(x1 + 7, dy, -1, 0); d.arrow(x2 - 7, dy, 1, 0);
  d.tx(x1 - 3, dy, '前', 'sm', 'end');
  d.tx(x2 + 3, dy, '后', 'sm', 'start');
  return d.o;
}

/* =====================================================================
   渲染
   ===================================================================== */
function render() {
  const svg = document.getElementById('sheet');
  fixNeck();

  let o = '';
  o += `<defs>
    <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#9aa7b6" stroke-width="1"/>
    </pattern>
  </defs>`;
  o += `<rect x="0" y="0" width="${SHEET.w}" height="${SHEET.h}" fill="#f7f9fb" rx="8"/>`;

  const left = (kind, r) => S.solid ? viewSolid(kind, r) : viewFace(kind, 'formed', r);
  o += left('upper', V.uFace);
  o += viewFace('upper', 'flat', V.uFlat);
  o += viewSide('upper', V.uSide);
  o += left('lower', V.lFace);
  o += viewFace('lower', 'flat', V.lFlat);
  o += viewSide('lower', V.lSide);

  svg.innerHTML = o;
  syncTools();
}

/* =====================================================================
   图上就地编辑
   ===================================================================== */
const edEl = document.getElementById('ed');
const wrapEl = document.getElementById('wrap');
let editing = null;

document.getElementById('sheet').addEventListener('click', e => {
  const tg = e.target.closest('[data-tg]');
  if (tg) {
    if (editing) commit(false);
    const k = tg.dataset.tg;
    setPath(k, !getPath(k));
    render();
    return;
  }
  const el = e.target.closest('[data-k]');
  if (!el) return;
  const k = el.dataset.k;
  if (!SPEC[k] && !DER[k]) return;
  if (editing) commit(false);
  const box = wrapEl.getBoundingClientRect();
  const rc = el.getBoundingClientRect();
  editing = k;
  edEl.value = fmt(valOf(k));
  edEl.style.left = (rc.left + rc.width / 2 - box.left) + 'px';
  edEl.style.top = (rc.top + rc.height / 2 - box.top) + 'px';
  edEl.hidden = false;
  edEl.focus();
  edEl.select();
});

edEl.addEventListener('input', () => {
  if (!editing) return;
  const sp = specOf(editing);
  const v = parseFloat(edEl.value);
  if (!isFinite(v) || v < sp[0] || v > sp[1]) return;
  putVal(editing, v);
  render();
});

edEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); commit(false); }
  else if (e.key === 'Escape') { e.preventDefault(); commit(true); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const sp = specOf(editing);
    const cur = parseFloat(edEl.value) || 0;
    const nv = clamp(cur + (e.key === 'ArrowUp' ? sp[2] : -sp[2]), sp[0], sp[1]);
    edEl.value = fmt(nv);
    putVal(editing, nv);
    render();
  }
});
edEl.addEventListener('blur', () => commit(false));

function commit(cancel) {
  if (!editing) return;
  const k = editing; editing = null;
  const sp = specOf(k);
  const before = valOf(k);
  if (!cancel) {
    let v = parseFloat(edEl.value);
    if (isFinite(v)) putVal(k, clamp(v, sp[0], sp[1]));
  }
  edEl.hidden = true;
  if (valOf(k) !== before) render();
}

/* =====================================================================
   工具条
   ===================================================================== */
function syncTools() {
  qa('#segT button', b => b.classList.toggle('on', String(S.t) === b.dataset.v));
  qa('#segGlue button', b => b.classList.toggle('on', (b.dataset.v === '1') === !!S.upper.useGlue));
  qa('#segEdge button', b => b.classList.toggle('on', S.upper.holeEdgeMode === b.dataset.v));
  qa('#segSide button', b => b.classList.toggle('on', S.upper.holeSide === b.dataset.v));
  document.getElementById('segEdge').style.display = S.upper.useGlue ? 'none' : '';
  document.getElementById('segSide').style.display = S.upper.useGlue ? 'none' : '';
  document.getElementById('btnDims').textContent = '标注 ' + (S.dims ? '开' : '关');
  document.getElementById('btnSolid').textContent = '斜视 ' + (S.solid ? '开' : '关');
  const name = S.model === 'glue' ? '胶条款' : '合页款';
  document.getElementById('sub').textContent = name + ' · 亚克力折弯 · mm · 上北下南左西右东 · 点数字改尺寸（成品立体图只读）';
  document.title = '挡风玻璃图纸 · ' + name;
}
function qa(sel, fn) { document.querySelectorAll(sel).forEach(fn); }

document.getElementById('segT').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.t = Number(b.dataset.v); render();
});
document.getElementById('segGlue').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.upper.useGlue = b.dataset.v === '1'; render();
});
document.getElementById('segEdge').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.upper.holeEdgeMode = b.dataset.v; render();
});
document.getElementById('segSide').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.upper.holeSide = b.dataset.v; render();
});
document.getElementById('btnDims').addEventListener('click', () => { S.dims = !S.dims; render(); });
document.getElementById('btnSolid').addEventListener('click', () => { if (editing) commit(false); S.solid = !S.solid; render(); });
document.getElementById('btnReset').addEventListener('click', () => {
  if (editing) commit(false);
  S.upper = JSON.parse(JSON.stringify(DEFAULTS.upper));
  S.lower = JSON.parse(JSON.stringify(DEFAULTS.lower));
  STORE[S.model] = snap();
  render();
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  const next = b.dataset.model;
  if (next === S.model) return;
  if (editing) commit(false);
  STORE[S.model] = snap();          /* 存回当前这款 */
  S.model = next;
  loadSnap(STORE[next]);            /* 载入另一款 */
  qa('.tab', t => t.classList.toggle('on', t.dataset.model === S.model));
  render();
});

window.addEventListener('resize', () => { if (editing) commit(false); });

render();
</script>
