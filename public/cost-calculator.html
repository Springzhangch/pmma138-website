<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粤丰表格小程序</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white'%3E表%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 1400px;
            background: #fff;
            border: 1px solid #c9cdd3;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }
        /* 顶部客户信息栏，表格外部 */
        .customer-info-bar{
            display:flex;
            flex-wrap:wrap;
            gap:12px 20px;
            padding:10px 12px;
            background:#f8f9fa;
            border-bottom:1px solid #d9dce1;
            align-items:center;
        }
        .info-item{
            display:flex;
            align-items:center;
            gap:6px;
        }
        .info-item label{
            font-size:13px;
            white-space:nowrap;
        }
        .info-item input{
            border:1px solid #c9cdd3;
            border-radius:4px;
            padding:4px 8px;
            font-size:13px;
            outline:none;
            min-width:120px;
        }
        .info-item input:focus{
            border-color:#0071e3;
            box-shadow:0 0 0 2px rgba(0,113,227,0.15);
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 12px;
            border-bottom: 1px solid #d9dce1;
            background: #f8f9fa;
            flex-wrap: wrap;
        }
        .brand {
            font-size: 14px;
            font-weight: 700;
            color: #0071e3;
            letter-spacing: 0.5px;
        }
        .btn-add-piece{
            padding:4px 12px;
            background:#0071e3;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-size:13px;
        }
        .btn-add-piece:hover{
            background:#0077ed;
        }
        .cell-info {
            font-size: 13px;
            font-weight: 600;
            background: #fff;
            border: 1px solid #c9cdd3;
            border-radius: 4px;
            padding: 3px 10px;
            min-width: 64px;
            text-align: center;
            color: #1d1d1f;
        }
        .formula-bar {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 220px;
        }
        .formula-label {
            font-size: 12px;
            color: #86868b;
            font-weight: 600;
            white-space: nowrap;
        }
        .formula-input {
            flex: 1;
            border: 1px solid #c9cdd3;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }
        .formula-input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.15);
        }
        .grid-wrap {
            overflow: auto;
            position: relative;
            max-height: 320px;
            border-bottom: 1px solid #d9dce1;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            width: max-content;
            min-width: 100%;
        }
        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #eef1f5;
            border: 1px solid #c9cdd3;
            font-size: 12px;
            font-weight: 700;
            color: #1d1d1f;
            text-align: center;
            height: 36px;
            vertical-align: middle;
            min-width: 88px;
            width: 88px;
            user-select: none;
        }
        thead th:hover {
            background: #e3e8ee;
        }
        tbody th {
            position: sticky;
            left: 0;
            z-index: 1;
            background: #eef1f5;
            border: 1px solid #c9cdd3;
            font-size: 12px;
            font-weight: 600;
            color: #1d1d1f;
            text-align: center;
            width: 52px;
            min-width: 52px;
            height: 26px;
            user-select: none;
        }
        tbody th:hover {
            background: #e3e8ee;
        }
        thead th.corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 3;
            background: #eef1f5;
        }
        td {
            border: 1px solid #d9dce1;
            height: 26px;
            min-width: 88px;
            width: 88px;
            font-size: 13px;
            padding: 0 6px;
            color: #1d1d1f;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #fff;
        }
        td:hover {
            background: #f4f7fa;
        }
        td.selected {
            box-shadow: inset 0 0 0 2px #0071e3;
            background: #eaf3ff;
        }
        td.active {
            box-shadow: inset 0 0 0 2px #0071e3;
            background: #fff;
        }
        td.locked {
            background: #f6f7f9;
            color: #3a3a3c;
            font-weight: 600;
            user-select: none;
            cursor: default;
        }
        td.locked:hover {
            background: #f6f7f9;
        }
        td.locked.selected {
            background: #f6f7f9;
            box-shadow: inset 0 0 0 2px #c9cdd3;
        }
        /* 单套片材料合计 - 求和高亮 */
        td.summary-total {
            background: #ABCD03 !important;
            color: #fff;
            font-weight: 700;
        }
        /* 单套片材料合计 - 标签 */
        td.summary-label {
            background: #f6f7f9;
            font-weight: 700;
        }
        /* 单套材料成本 - 求和高亮（M列：单片价格之和） */
        td.summary-total2 {
            background: #ABCD03 !important;
            color: #fff;
            font-weight: 700;
        }
        /* 单套材料成本 - 标签（L列） */
        td.summary-label2 {
            background: #f6f7f9;
            font-weight: 700;
        }
        /* 第0行表头：业务字段名，支持两行文字居中 */
        td[data-row="0"] {
            height: 40px;
            vertical-align: middle;
            text-align: center;
            line-height: 1.25;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }
        .placeholder-text{
            color:#b0b0b5;
        }
        td select{
            width:100%;
            height:100%;
            border:none;
            background:transparent;
            font-size:13px;
            outline:none;
        }
        .del-btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:18px;
            height:18px;
            margin-left:6px;
            background:#ed4337;
            color:#fff;
            border:none;
            border-radius:3px;
            font-size:14px;
            line-height:1;
            cursor:pointer;
            padding:0;
        }
        .del-btn:hover{
            background:#d0382e;
        }

        /* =====自定义列宽===== */
        /* A列 片序号 data‑col=0 */
        td[data-col="0"], thead th:nth-child(2) {
            width:60px;
            min-width:60px;
        }
        /* C列 位置 data‑col=2 */
        td[data-col="2"], thead th:nth-child(4) {
            width:66px;
            min-width:66px;
        }
        /* 工序表格 C列(工序名称) 独立宽度：88px */
        #gridProc td[data-col="2"], #gridProc thead th:nth-child(4) {
            width:88px;
            min-width:88px;
        }
        /* 汇总表格 所有列宽度：88px */
        #gridSummary th, #gridSummary td {
            width:88px;
            min-width:88px;
        }
        /* D片长 data‑col=3 */
        td[data-col="3"], thead th:nth-child(5) {
            width:66px;
            min-width:66px;
        }
        /* E片宽 data‑col=4 */
        td[data-col="4"], thead th:nth-child(6) {
            width:66px;
            min-width:66px;
        }
        /* F片高 data‑col=5 */
        td[data-col="5"], thead th:nth-child(7) {
            width:66px;
            min-width:66px;
        }
        /* G板材长 data‑col=6 */
        td[data-col="6"], thead th:nth-child(8) {
            width:66px;
            min-width:66px;
        }
        /* H板材宽 data‑col=7 */
        td[data-col="7"], thead th:nth-child(9) {
            width:66px;
            min-width:66px;
        }
        /* I板材高 data‑col=8 */
        td[data-col="8"], thead th:nth-child(10) {
            width:66px;
            min-width:66px;
        }
        /* J单价(元/KG) data‑col=9 */
        td[data-col="9"], thead th:nth-child(11) {
            width:66px;
            min-width:66px;
        }
        /* K单套用量 data‑col=10 */
        td[data-col="10"], thead th:nth-child(12) {
            width:66px;
            min-width:66px;
        }
        /* L所需数量(pcs) data‑col=11 */
        td[data-col="11"], thead th:nth-child(13) {
            width:66px;
            min-width:66px;
        }
        /* M单片价格 data‑col=12 */
        td[data-col="12"], thead th:nth-child(14) {
            width:66px;
            min-width:66px;
        }
        /* N最大可开片数 data‑col=13 */
        td[data-col="13"], thead th:nth-child(15) {
            width:66px;
            min-width:66px;
        }
        /* 表格块之间的分隔 */
        .sheet-block {
            border-bottom: 1px solid #c9cdd3;
        }
        .sheet-block .sub-toolbar {
            display:flex;
            align-items:center;
            gap:10px;
            padding:6px 12px;
            background:#eef1f5;
            border-bottom:1px solid #d9dce1;
        }
        .sheet-block .sub-label {
            font-size:13px;
            font-weight:700;
            color:#1d1d1f;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 最顶部客户信息栏，表格外部 -->
        <div class="customer-info-bar">
            <div class="info-item">
                <label>客户名称：</label>
                <input type="text" id="inpCustomerName"/>
            </div>
            <div class="info-item">
                <label>日期：</label>
                <input type="text" id="inpDate"/>
            </div>
            <div class="info-item">
                <label>数量：</label>
                <input type="number" id="inpTopQty"/>
            </div>
            <div class="info-item">
                <label>业务：</label>
                <input type="text" id="inpBiz"/>
            </div>
            <div class="info-item">
                <label>客户类型：</label>
                <input type="text" id="inpCustType"/>
            </div>
        </div>
        <!-- 全局工具栏：单元格地址 + 内容编辑框，服务当前活动表格 -->
        <div class="toolbar">
            <div class="brand">粤丰表格</div>
            <div class="cell-info" id="cellInfo">A1</div>
            <div class="formula-bar">
                <span class="formula-label">内容</span>
                <input class="formula-input" id="formulaInput" spellcheck="false" placeholder="">
            </div>
        </div>

        <!-- ===== 片表格 ===== -->
        <div class="sheet-block">
            <div class="sub-toolbar">
                <span class="sub-label">片</span>
                <button class="btn-add-piece" id="btnAddPiece">增加片</button>
            </div>
            <div class="grid-wrap">
                <table id="grid"></table>
            </div>
        </div>

        <!-- ===== 工序表格 ===== -->
        <div class="sheet-block">
            <div class="sub-toolbar">
                <span class="sub-label">工序</span>
                <button class="btn-add-piece" id="btnAddProc">增加工序</button>
            </div>
            <div class="grid-wrap">
                <table id="gridProc"></table>
            </div>
        </div>

        <!-- ===== 配件表格 ===== -->
        <div class="sheet-block">
            <div class="sub-toolbar">
                <span class="sub-label">配件</span>
                <button class="btn-add-piece" id="btnAddPart">增加配件</button>
            </div>
            <div class="grid-wrap">
                <table id="gridPart"></table>
            </div>
        </div>

        <!-- ===== 汇总表格（无行号、无增删按钮） ===== -->
        <div class="sheet-block">
            <div class="grid-wrap">
                <table id="gridSummary"></table>
            </div>
        </div>
    </div>
    <script>
        const COLS = 26;
        const GAP = 3; //普通板材开料间隙3mm

        // 全局：当前获得焦点（被操作）的表格实例
        let activeTable = null;

        function colName(i) {
            return String.fromCharCode(65 + i);
        }
        function cellAddress(r, c) {
            return colName(c) + (r + 1);
        }

        // 可复用电子表格：片表格、工序表格都是它的实例
        class Spreadsheet {
            constructor(opts) {
                this.tableId = opts.tableId;
                this.cornerText = opts.cornerText;
                this.addBtnId = opts.addBtnId;
                this.header = opts.header || [];
                this.initialRows = opts.initialRows || 3;
                this.maxRows = opts.maxRows || 100;
                // 运算相关回调（片表格传入，工序表格稍后补充）
                this.recalcRowFn = opts.recalcRow || null;
                this.updateSummaryFn = opts.updateSummaryRow || null;
                this.onAddItemFn = opts.onAddItem || null;
                this.validateFn = opts.validateCellInput || null;
                this.buildHeaderRowFn = opts.buildHeaderRow || null; // 自定义第0行表头（支持合并单元格）
                this.onRowCreatedFn = opts.onRowCreated || null;     // 每行创建后回调（用于数据行合并等）
                this.itemMarker = opts.itemMarker || 'piece'; // 行标记名，便于区分片/工序

                this.rowCount = this.initialRows;
                this.itemCount = 0;
                this.activeCell = null;
                this.isRemoving = false;
            }

            get table() { return document.getElementById(this.tableId); }
            get tbody() { return this.table.querySelector('tbody'); }

            getCell(r, c) {
                return this.table.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
            }
            getRowCells(r) {
                const arr = [];
                for (let c = 0; c < COLS; c++) arr.push(this.getCell(r, c));
                return arr;
            }

            // 创建一个物理行：r=0 为字段名行，其余为可编辑数据行
            createRow(r) {
                const tr = document.createElement('tr');
                const rh = document.createElement('th');
                rh.textContent = r + 1;
                tr.appendChild(rh);
                // 自定义表头行（支持合并单元格）
                if (r === 0 && this.buildHeaderRowFn) {
                    this.buildHeaderRowFn.call(this, r, tr);
                    return tr;
                }
                for (let c = 0; c < COLS; c++) {
                    const td = document.createElement('td');
                    td.dataset.row = r;
                    td.dataset.col = c;
                    if (r === 0 && c < this.header.length) {
                        td.innerHTML = this.header[c];
                        td.classList.add('locked');
                        td.setAttribute('contenteditable', 'false');
                        td.dataset.locked = '1';
                        td.addEventListener('mousedown', (e) => this.onCellMouseDown(e));
                    } else {
                        td.setAttribute('contenteditable', 'true');
                        td.addEventListener('mousedown', (e) => this.onCellMouseDown(e));
                        td.addEventListener('focus', (e) => this.onCellFocus(e));
                        td.addEventListener('blur', (e) => this.onCellBlur(e));
                        td.addEventListener('input', (e) => this.onCellInput(e));
                        td.addEventListener('keydown', (e) => this.onCellKeyDown(e));
                    }
                    tr.appendChild(td);
                }
                if (this.onRowCreatedFn) this.onRowCreatedFn.call(this, r, tr);
                return tr;
            }

            appendRow() {
                this.tbody.appendChild(this.createRow(this.rowCount));
                this.rowCount++;
            }

            removeLastRow() {
                if (this.rowCount <= this.initialRows) return;
                this.tbody.removeChild(this.tbody.lastElementChild);
                this.rowCount--;
            }

            build() {
                const table = this.table;
                const thead = document.createElement('thead');
                const headRow = document.createElement('tr');
                const corner = document.createElement('th');
                corner.className = 'corner';
                corner.textContent = this.cornerText;
                headRow.appendChild(corner);
                for (let c = 0; c < COLS; c++) {
                    const th = document.createElement('th');
                    th.textContent = colName(c);
                    headRow.appendChild(th);
                }
                thead.appendChild(headRow);
                table.appendChild(thead);
                const tbody = document.createElement('tbody');
                for (let r = 0; r < this.initialRows; r++) {
                    tbody.appendChild(this.createRow(r));
                }
                table.appendChild(tbody);

                if (this.addBtnId) {
                    document.getElementById(this.addBtnId).addEventListener('click', () => this.addItem());
                }
            }

            setPlaceholder(rowIdx, colIdx, text) {
                const td = this.getCell(rowIdx, colIdx);
                td.innerHTML = `<span class="placeholder-text">${text}</span>`;
                td.dataset.placeholder = text;
            }

            reIndex() {
                let seq = 1;
                for (let r = 1; r < this.rowCount; r++) {
                    const cellA = this.getCell(r, 0);
                    if (cellA && cellA.dataset[this.itemMarker] === '1') {
                        const btn = cellA.querySelector('.del-btn');
                        cellA.innerHTML = seq + '';
                        if (btn) cellA.appendChild(btn);
                        seq++;
                    }
                }
                this.itemCount = seq - 1;
            }

            clearWholeRow(r) {
                const cells = this.getRowCells(r);
                cells.forEach((td) => {
                    td.innerHTML = '';
                    td.classList.remove('locked','summary-total','summary-label','summary-total2','summary-label2');
                    td.dataset.locked = '';
                    delete td.dataset[this.itemMarker];
                    delete td.dataset.placeholder;
                    delete td.dataset.summary;
                    delete td.dataset.summary2;
                    td.setAttribute('contenteditable', 'true');
                    td.oninput = null;
                });
            }

            copyRowContent(srcR, destR) {
                const srcCells = this.getRowCells(srcR);
                const dstCells = this.getRowCells(destR);
                for (let c = 0; c < COLS; c++) {
                    const srcTd = srcCells[c];
                    const dstTd = dstCells[c];
                    dstTd.innerHTML = srcTd.innerHTML;
                    for (let k in dstTd.dataset) {
                        if (k !== 'row' && k !== 'col' && k !== this.itemMarker) delete dstTd.dataset[k];
                    }
                    for (let k in srcTd.dataset) {
                        if (k !== 'row' && k !== 'col' && k !== this.itemMarker) dstTd.dataset[k] = srcTd.dataset[k];
                    }
                    dstTd.className = srcTd.className;
                    dstTd.setAttribute('contenteditable', srcTd.getAttribute('contenteditable'));
                    dstTd.oninput = null;
                    // 同步下拉框的当前选中值（innerHTML 不包含 selected 状态）
                    const srcSel = srcTd.querySelector('select');
                    const dstSel = dstTd.querySelector('select');
                    if (srcSel && dstSel) dstSel.value = srcSel.value;
                }
                // 片表格特有的 F→I 同步
                const fTd = dstCells[5];
                const iTd = dstCells[8];
                if (this.onAddItemFn) {
                    const self = this;
                    fTd.oninput = function () {
                        const val = this.textContent.trim();
                        iTd.textContent = (val && !this.querySelector('.placeholder-text')) ? val : '';
                        self.recalcRow(destR);
                    };
                }
                const delBtn = dstCells[0].querySelector('.del-btn');
                if (delBtn) {
                    const self = this;
                    delBtn.onclick = function (e) {
                        e.stopPropagation();
                        const realR = Number(dstCells[0].dataset.row);
                        self.removeItemRow(realR);
                    };
                }
                this.recalcRow(destR);
            }

            recalcRow(r) {
                if (this.recalcRowFn) this.recalcRowFn.call(this, r);
            }

            updateSummaryRow(force) {
                if (this.updateSummaryFn) this.updateSummaryFn.call(this, force);
            }

            removeItemRow(delRowIndex) {
                this.isRemoving = true;
                const itemRows = [];
                for (let r = 1; r < this.rowCount; r++) {
                    const cellA = this.getCell(r, 0);
                    if (cellA && cellA.dataset[this.itemMarker] === '1') itemRows.push(r);
                }
                const idx = itemRows.indexOf(delRowIndex);
                if (idx === -1) { this.isRemoving = false; return; }
                itemRows.splice(idx, 1);
                for (let r = 1; r < this.rowCount; r++) {
                    const cellA = this.getCell(r, 0);
                    if (cellA) delete cellA.dataset[this.itemMarker];
                }
                for (let newPos = 0; newPos < itemRows.length; newPos++) {
                    const srcR = itemRows[newPos];
                    const destR = newPos + 1;
                    this.getCell(destR, 0).dataset[this.itemMarker] = '1';
                    if (srcR !== destR) this.copyRowContent(srcR, destR);
                }
                const clearStart = itemRows.length + 1;
                for (let r = clearStart; r < this.rowCount; r++) this.clearWholeRow(r);
                this.reIndex();
                this.removeLastRow();
                this.isRemoving = false;
                this.updateSummaryRow(true);
            }

            addItem(append = true) {
                if (this.rowCount >= this.maxRows) {
                    alert('已到达最大行数，无法继续新增');
                    return;
                }
                this.itemCount++;
                const r = this.itemCount;
                if (append) this.appendRow();
                const cells = this.getRowCells(r);
                const cellA = cells[0];
                cellA.dataset[this.itemMarker] = '1';
                cellA.classList.add('locked');
                cellA.dataset.locked = '1';
                cellA.setAttribute('contenteditable', 'false');
                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.innerText = '−';
                const self = this;
                delBtn.onclick = function (e) {
                    e.stopPropagation();
                    self.removeItemRow(r);
                };
                cellA.innerHTML = this.itemCount + '';
                cellA.appendChild(delBtn);

                if (this.onAddItemFn) this.onAddItemFn.call(this, r, cells);

                this.recalcRow(r);
                this.updateSummaryRow();
            }

            // ===== 单元格交互 =====
            onCellMouseDown(e) { this.selectCell(e.currentTarget); }

            onCellFocus(e) {
                const cell = e.currentTarget;
                if (cell.querySelector('.placeholder-text')) cell.textContent = '';
                this.selectCell(cell, true);
                const range = document.createRange();
                range.selectNodeContents(cell);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            }

            onCellBlur(e) {
                const cell = e.currentTarget;
                const phText = cell.dataset.placeholder;
                if (phText) {
                    const txt = cell.textContent.trim();
                    if (txt === '') cell.innerHTML = `<span class="placeholder-text">${phText}</span>`;
                }
                const r = Number(cell.dataset.row);
                const cellA = this.getCell(r, 0);
                if (cellA && cellA.dataset[this.itemMarker] === '1') this.recalcRow(r);
            }

            validateCellInput(cell, c) {
                if (this.validateFn) return this.validateFn.call(this, cell, c);
                return true;
            }

            selectCell(cell, focus) {
                if (this.activeCell && this.activeCell !== cell) {
                    this.activeCell.classList.remove('selected', 'active');
                }
                this.activeCell = cell;
                cell.classList.add(focus ? 'active' : 'selected');
                const r = +cell.dataset.row;
                const c = +cell.dataset.col;
                document.getElementById('cellInfo').textContent = cellAddress(r, c);
                document.getElementById('formulaInput').value = cell.textContent;
                // 切到本实例为活动表
                activeTable = this;
            }

            onCellInput(e) {
                const cell = e.currentTarget;
                const c = Number(cell.dataset.col);
                const r = Number(cell.dataset.row);
                if (!this.validateCellInput(cell, c)) cell.textContent = '';
                document.getElementById('formulaInput').value = cell.textContent;
                const cellA = this.getCell(r, 0);
                if (cellA && cellA.dataset[this.itemMarker] === '1') this.recalcRow(r);
            }

            onCellKeyDown(e) {
                const cell = e.currentTarget;
                const r = +cell.dataset.row;
                const c = +cell.dataset.col;
                let handled = true;
                if (e.key === 'Enter') {
                    e.preventDefault(); cell.blur(); this.moveTo(r + 1, c);
                } else if (e.key === 'Tab') {
                    e.preventDefault(); cell.blur(); this.moveTo(r, c + 1);
                } else if (e.key === 'Escape') {
                    e.preventDefault(); cell.blur(); cell.classList.add('selected');
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault(); cell.blur(); this.moveTo(r + 1, c);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault(); cell.blur(); this.moveTo(r - 1, c);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault(); cell.blur(); this.moveTo(r, c + 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault(); cell.blur(); this.moveTo(r, c - 1);
                } else handled = false;
                e.stopPropagation();
            }

            moveTo(r, c) {
                if (r < 0 || r >= this.rowCount || c < 0 || c >= COLS) return;
                const cell = this.getCell(r, c);
                if (cell) { this.selectCell(cell); cell.focus(); }
            }
        }

        // ============================================================
        // 片表格：完整运算逻辑
        // ============================================================
        const HEADER_PIECE = ['片序号','板材','位置','片长','片宽','片高','板材长','板材宽','板材高','单价<br>(元/KG)','单套用量','所需数量<br>(pcs)','单片价格','最大<br>可开片数','单张板价格','所需板材数','该板材总价','片总价'];

        function calcMaxCuts(L, W, pL, pW) {
            if (L <= 0 || W <= 0) return 0;
            const v1 = Math.floor(L / (pL + GAP)) * Math.floor(W / (pW + GAP));
            const v2 = Math.floor(L / (pW + GAP)) * Math.floor(W / (pL + GAP));
            return Math.max(v1, v2);
        }

        const pieceTable = new Spreadsheet({
            tableId: 'grid',
            cornerText: '片',
            addBtnId: 'btnAddPiece',
            header: HEADER_PIECE,
            initialRows: 3,
            itemMarker: 'piece',

            validateCellInput(cell, c) {
                const val = cell.textContent.trim();
                if ([3, 4, 5].includes(c)) {
                    if (val === '') return true;
                    return /^\d+(\.\d{0,2})?$/.test(val);
                }
                if (c === 9) {
                    if (val === '') return true;
                    return /^\d+(\.\d{0,1})?$/.test(val);
                }
                if (c === 10) {
                    if (val === '') return true;
                    return /^[0-9]+$/.test(val);
                }
                return true;
            },

            onAddItem(r, cells) {
                const cellB = cells[1];
                cellB.textContent = '透明板';
                cellB.classList.remove('locked');
                cellB.setAttribute('contenteditable', 'true');

                const cellC = cells[2];
                cellC.innerHTML = '';
                const sel = document.createElement('select');
                ['底板', '左侧', '右侧', '前侧', '后侧', '盖板', '顶板', '隔板', '其他', '独立'].forEach(optText => {
                    const opt = document.createElement('option');
                    opt.innerText = optText;
                    sel.appendChild(opt);
                });
                cellC.appendChild(sel);

                this.setPlaceholder(r, 3, '待输入');
                this.setPlaceholder(r, 4, '待输入');
                this.setPlaceholder(r, 5, '待输入');

                cells[6].textContent = '2440';
                cells[7].textContent = '1220';

                const cellI = cells[8];
                cellI.textContent = '';
                cellI.classList.add('locked');
                cellI.dataset.locked = '1';
                cellI.setAttribute('contenteditable', 'false');

                this.setPlaceholder(r, 9, '待输入');
                this.setPlaceholder(r, 10, '待输入');
                //L列 所需数量(pcs) c=11：自动计算，不需要占位
                cells[11].innerHTML = '';
                cells[11].classList.add('locked');
                cells[11].dataset.locked = '1';
                cells[11].setAttribute('contenteditable', 'false');

                //N最大可开片数c13、O单张板价格c14、P所需板材数c15、Q该板材总价c16、R片总价c17
                cells[13].innerHTML = ''; cells[13].classList.add('locked'); cells[13].dataset.locked = '1'; cells[13].setAttribute('contenteditable', 'false');
                cells[14].innerHTML = ''; cells[14].classList.add('locked'); cells[14].dataset.locked = '1'; cells[14].setAttribute('contenteditable', 'false');
                cells[15].innerHTML = ''; cells[15].classList.add('locked'); cells[15].dataset.locked = '1'; cells[15].setAttribute('contenteditable', 'false');
                cells[16].innerHTML = '';
                cells[17].innerHTML = ''; cells[17].classList.add('locked'); cells[17].dataset.locked = '1'; cells[17].setAttribute('contenteditable', 'false');

                const cellF = cells[5];
                const self = this;
                cellF.oninput = function () {
                    const val = this.textContent.trim();
                    cellI.textContent = (val && !this.querySelector('.placeholder-text')) ? val : '';
                    self.recalcRow(r);
                };
            },

            recalcRow(r) {
                const get = (c) => {
                    const td = this.getCell(r, c);
                    if (!td) return NaN;
                    if (td.querySelector('.placeholder-text')) return NaN;
                    const txt = td.textContent.trim();
                    if (txt === '') return NaN;
                    return parseFloat(txt);
                };
                const set = (c, val, locked = false) => {
                    const td = this.getCell(r, c);
                    if (!td) return;
                    if (isNaN(val) || !isFinite(val)) {
                        td.textContent = '';
                    } else {
                        td.textContent = Number.isInteger(val) ? val.toString() : val.toFixed(2);
                    }
                    if (locked) {
                        td.classList.add('locked');
                        td.dataset.locked = '1';
                        td.setAttribute('contenteditable', 'false');
                    }
                };

                const topQtyInput = document.getElementById('inpTopQty');
                const topQty = parseFloat(topQtyInput.value);

                const productL = get(3);
                const productW = get(4);
                const productT = get(5);
                const boardL = get(6);
                const boardW = get(7);
                const unitPrice = get(9);
                const singleSetQty = get(10);

                // 最大可开片数 c13
                let maxCutPerBoard = NaN;
                if (!isNaN(productL) && !isNaN(productW) && !isNaN(boardL) && !isNaN(boardW)) {
                    const a = Math.floor(boardL / (productL + GAP));
                    const b = Math.floor(boardW / (productW + GAP));
                    const m1Init = a * b;
                    const remL1 = boardL - a * (productL + GAP);
                    const remW1 = boardW - b * (productW + GAP);
                    const m1r1 = calcMaxCuts(remL1, boardW, productL, productW);
                    const m1r2 = calcMaxCuts(boardL, remW1, productL, productW);
                    const method1Total = m1Init + m1r1 + m1r2;
                    const c = Math.floor(boardL / (productW + GAP));
                    const d = Math.floor(boardW / (productL + GAP));
                    const m2Init = c * d;
                    const remL2 = boardL - c * (productW + GAP);
                    const remW2 = boardW - d * (productL + GAP);
                    const m2r1 = calcMaxCuts(remL2, boardW, productL, productW);
                    const m2r2 = calcMaxCuts(boardL, remW2, productL, productW);
                    const method2Total = m2Init + m2r1 + m2r2;
                    maxCutPerBoard = Math.max(method1Total, method2Total);
                }
                set(13, maxCutPerBoard, true);

                // 单张板价格 c14
                let boardPrice = NaN;
                if (!isNaN(boardL) && !isNaN(boardW) && !isNaN(productT) && !isNaN(unitPrice)) {
                    boardPrice = (boardL / 1000) * (boardW / 1000) * productT * 1.2 * unitPrice;
                }
                set(14, boardPrice, true);

                // 所需数量(pcs) c11
                let needQty = NaN;
                if (!isNaN(topQty) && !isNaN(singleSetQty)) needQty = topQty * singleSetQty;
                set(11, needQty, true);

                if (isNaN(maxCutPerBoard) || maxCutPerBoard <= 0 || isNaN(boardPrice) || isNaN(needQty)) {
                    set(12, NaN);
                    set(15, NaN);
                    set(16, NaN);
                    set(17, NaN, true);
                    this.updateSummaryRow();
                    return;
                }

                const singleCost = boardPrice / maxCutPerBoard;
                set(12, singleCost);

                const needBoard = Math.ceil(needQty / maxCutPerBoard);
                set(15, needBoard, true);

                const totalBoardCost = needBoard * boardPrice;
                set(16, totalBoardCost);

                if (!isNaN(needQty) && !isNaN(singleCost)) set(17, needQty * singleCost, true);
                else set(17, NaN, true);
                this.updateSummaryRow();
            },

            updateSummaryRow(force) {
                if (this.isRemoving && !force) return;
                for (let r = 1; r < this.rowCount; r++) {
                    const qTd = this.getCell(r, 16);
                    const rTd = this.getCell(r, 17);
                    const qIsSum = qTd && (qTd.dataset.summary === '1' || qTd.classList.contains('summary-label'));
                    const rIsSum = rTd && (rTd.dataset.summary === '1' || rTd.classList.contains('summary-total'));
                    if (qIsSum) {
                        qTd.innerHTML = ''; qTd.classList.remove('locked','summary-label'); qTd.dataset.locked = '';
                        delete qTd.dataset.summary; qTd.setAttribute('contenteditable', 'true');
                    }
                    if (rIsSum) {
                        rTd.innerHTML = ''; rTd.classList.remove('locked','summary-total'); rTd.dataset.locked = '';
                        delete rTd.dataset.summary; rTd.setAttribute('contenteditable', 'true');
                    }
                    const lTd = this.getCell(r, 11);
                    const mTd = this.getCell(r, 12);
                    const lIsSum2 = lTd && (lTd.dataset.summary2 === '1' || lTd.classList.contains('summary-label2'));
                    const mIsSum2 = mTd && (mTd.dataset.summary2 === '1' || mTd.classList.contains('summary-total2'));
                    if (lIsSum2) {
                        lTd.innerHTML = ''; lTd.classList.remove('locked','summary-label2'); lTd.dataset.locked = '';
                        delete lTd.dataset.summary2; lTd.setAttribute('contenteditable', 'true');
                    }
                    if (mIsSum2) {
                        mTd.innerHTML = ''; mTd.classList.remove('locked','summary-total2'); mTd.dataset.locked = '';
                        delete mTd.dataset.summary2; mTd.setAttribute('contenteditable', 'true');
                    }
                }
                let lastItemRow = -1;
                let sumPieceTotal = 0;
                let sumSingleCost = 0;
                let hasSumPiece = false;
                let hasSumSingle = false;
                for (let r = 1; r < this.rowCount; r++) {
                    const cellA = this.getCell(r, 0);
                    if (cellA && cellA.dataset.piece === '1') {
                        lastItemRow = r;
                        const rTd = this.getCell(r, 17);
                        if (rTd) {
                            const txt = rTd.textContent.trim();
                            if (txt !== '') { const v = parseFloat(txt); if (!isNaN(v)) { sumPieceTotal += v; hasSumPiece = true; } }
                        }
                        const mTd = this.getCell(r, 12);
                        if (mTd) {
                            const txt = mTd.textContent.trim();
                            if (txt !== '') {
                                const price = parseFloat(txt);
                                if (!isNaN(price)) {
                                    // 单套材料成本 = Σ(单套用量 K × 单片价格 M)，用量为空按1计
                                    const kTd = this.getCell(r, 10);
                                    let qty = 1;
                                    if (kTd && !kTd.querySelector('.placeholder-text')) {
                                        const kv = parseFloat(kTd.textContent.trim());
                                        if (!isNaN(kv)) qty = kv;
                                    }
                                    sumSingleCost += qty * price;
                                    hasSumSingle = true;
                                }
                            }
                        }
                    }
                }
                if (lastItemRow === -1) return;
                const summaryRow = lastItemRow + 1;
                if (summaryRow >= this.rowCount) return;
                const qSum = this.getCell(summaryRow, 16);
                if (qSum) {
                    qSum.innerHTML = '单套片材料合计'; qSum.classList.add('locked','summary-label');
                    qSum.dataset.locked = '1'; qSum.dataset.summary = '1'; qSum.setAttribute('contenteditable', 'false');
                }
                const rSum = this.getCell(summaryRow, 17);
                if (rSum) {
                    rSum.innerHTML = hasSumPiece ? (Number.isInteger(sumPieceTotal) ? sumPieceTotal.toString() : sumPieceTotal.toFixed(2)) : '';
                    rSum.classList.add('locked','summary-total'); rSum.dataset.locked = '1';
                    rSum.dataset.summary = '1'; rSum.setAttribute('contenteditable', 'false');
                }
                const lSum = this.getCell(summaryRow, 11);
                if (lSum) {
                    lSum.innerHTML = '单套材料成本'; lSum.classList.add('locked','summary-label2');
                    lSum.dataset.locked = '1'; lSum.dataset.summary2 = '1'; lSum.setAttribute('contenteditable', 'false');
                }
                const mSum = this.getCell(summaryRow, 12);
                if (mSum) {
                    mSum.innerHTML = hasSumSingle ? (Number.isInteger(sumSingleCost) ? sumSingleCost.toString() : sumSingleCost.toFixed(2)) : '';
                    mSum.classList.add('locked','summary-total2'); mSum.dataset.locked = '1';
                    mSum.dataset.summary2 = '1'; mSum.setAttribute('contenteditable', 'false');
                }
                if (typeof updateSummaryTable === 'function') updateSummaryTable();
            }
        });

        // 顶部数量变更 → 刷新片表格全部行
        function refreshAllPieceRows() {

        // ============================================================

        const PROC_NAMES = ['开料','钻石刨','修斜边','抛光','打孔','压磁铁','精雕','激光','打标','烤弯','UV','丝印','组装','撕膜','清洁','包装'];

                };
                mk(0, '配件号');
                mk(1, '配件名称', 2);   // B~C 合并
                mk(3, '规格和尺寸', 4); // D~G 合并
                mk(7, '数量');
                mk(8, '单位');
                mk(9, '单价');
                mk(10, '合计');
                for (let c = 11; c < COLS; c++) mk(c, '');
            },

            // 数据行：B~C 合并、D~G 合并（保留隐藏 DOM 避免破坏遍历）
            onRowCreated(r, tr) {
                if (r === 0) return;
                const tds = tr.querySelectorAll('td');
                tds[1].colSpan = 2;            // B~C
                tds[2].style.display = 'none';
                tds[3].colSpan = 4;            // D~G
                for (let i = 4; i <= 6; i++) tds[i].style.display = 'none';
            },

            validateCellInput(cell, c) {
                const val = cell.textContent.trim();
                if (c === 7 || c === 9) { // H 数量、J 单价：数字，最多两位小数
                    if (val === '') return true;
                    return /^\d+(\.\d{0,2})?$/.test(val);
                }
                return true;
            },

            // K 合计 = H 数量 × J 单价
            recalcRow(r) {
                const get = (c) => {
                    const td = this.getCell(r, c);
                    if (!td) return NaN;
                    const txt = td.textContent.trim();
                    if (txt === '') return NaN;
                    return parseFloat(txt);
                };
                const set = (c, val) => {
                    const td = this.getCell(r, c);
                    if (!td) return;
                    if (isNaN(val) || !isFinite(val)) {
                        td.textContent = '';
                    } else {
                        td.textContent = Number.isInteger(val) ? val.toString() : val.toFixed(2);
                    }
                    td.classList.add('locked');
                    td.dataset.locked = '1';
                    td.setAttribute('contenteditable', 'false');
                };
                const qty = get(7);   // H 数量
                const price = get(9); // J 单价
                if (isNaN(qty) || isNaN(price)) {
                    set(10, NaN);
                } else {
                    set(10, qty * price);
                }
                this.updateSummaryRow();
            },

            // 合计行：最后一条配件的下一行，J列标签「单套配件成本」+ K列求和（所有配件K列合计之和）
            updateSummaryRow(force) {
                if (this.isRemoving && !force) return;
                // 1. 清除旧合计标记（J/K列）
                for (let r = 1; r < this.rowCount; r++) {
                    const jTd = this.getCell(r, 9);
                    const kTd = this.getCell(r, 10);
                    const jIsSum = jTd && (jTd.dataset.summary === '1' || jTd.classList.contains('summary-label'));
                    const kIsSum = kTd && (kTd.dataset.summary === '1' || kTd.classList.contains('summary-total'));
                    if (jIsSum) {
                        jTd.innerHTML = ''; jTd.classList.remove('locked','summary-label'); jTd.dataset.locked = '';
                        delete jTd.dataset.summary; jTd.setAttribute('contenteditable', 'true');
                    }
                    if (kIsSum) {
                        kTd.innerHTML = ''; kTd.classList.remove('locked','summary-total'); kTd.dataset.locked = '';
                        delete kTd.dataset.summary; kTd.setAttribute('contenteditable', 'true');
                    }
                }
                // 2. 收集所有配件行，找最后一条 + 累计 K列合计
                let lastItemRow = -1;
                let sumTotal = 0;
                let hasSum = false;
                for (let r = 1; r < this.rowCount; r++) {
                    const cellA = this.getCell(r, 0);
                    if (cellA && cellA.dataset.part === '1') {
                        lastItemRow = r;
                        const kTd = this.getCell(r, 10);
                        if (kTd) {
                            const txt = kTd.textContent.trim();
                            if (txt !== '') {
                                const v = parseFloat(txt);
                                if (!isNaN(v)) { sumTotal += v; hasSum = true; }
                            }
                        }
                    }
                }
                if (lastItemRow === -1) return;
                const summaryRow = lastItemRow + 1;
                if (summaryRow >= this.rowCount) return;
                // 3. 写入合计
                const jSum = this.getCell(summaryRow, 9);
                if (jSum) {
                    jSum.innerHTML = '单套配件成本';
                    jSum.classList.add('locked','summary-label');
                    jSum.dataset.locked = '1'; jSum.dataset.summary = '1';
                    jSum.setAttribute('contenteditable', 'false');
                }
                const kSum = this.getCell(summaryRow, 10);
                if (kSum) {
                    kSum.innerHTML = hasSum
                        ? (Number.isInteger(sumTotal) ? sumTotal.toString() : sumTotal.toFixed(2))
                        : '';
                    kSum.classList.add('locked','summary-total'); // 背景 #ABCD03
                    kSum.dataset.locked = '1'; kSum.dataset.summary = '1';
                    kSum.setAttribute('contenteditable', 'false');
                }
                if (typeof updateSummaryTable === 'function') updateSummaryTable();
            },

            onAddItem(r, cells) {
                // A 列配件号 + 删除按钮已由 addItem 填好

                // B~C 配件名称：默认空，可编辑
                cells[1].textContent = '';
                cells[1].classList.remove('locked','summary-label','summary-total');
                delete cells[1].dataset.summary;

                // D~G 规格和尺寸：默认空，可编辑
                cells[3].textContent = '';

                // H 数量：默认 1，可编辑，限数字两位小数
                const cellH = cells[7];
                cellH.textContent = '1';
                cellH.classList.remove('locked','summary-label','summary-total');
                cellH.removeAttribute('data-locked');
                delete cellH.dataset.summary;
                cellH.setAttribute('contenteditable', 'true');

                // I 单位：下拉框 pcs/kg/g/件/套
                const cellI = cells[8];
                cellI.innerHTML = '';
                cellI.classList.remove('locked');
                cellI.removeAttribute('data-locked');
                cellI.setAttribute('contenteditable', 'true');
                const selI = document.createElement('select');
                ['pcs', 'kg', 'g', '件', '套'].forEach(t => {
                    const o = document.createElement('option');
                    o.innerText = t;
                    selI.appendChild(o);
                });
                cellI.appendChild(selI);

                // J 单价：默认空，可编辑，限数字两位小数
                const cellJ = cells[9];
                cellJ.textContent = '';
                cellJ.classList.remove('locked','summary-label','summary-total');
                cellJ.removeAttribute('data-locked');
                delete cellJ.dataset.summary;
                cellJ.setAttribute('contenteditable', 'true');

                // K 合计：自动计算（数量×单价），锁定
                const cellK = cells[10];
                cellK.textContent = '';
                cellK.classList.remove('summary-label','summary-total');
                delete cellK.dataset.summary;
                cellK.classList.add('locked');
                cellK.dataset.locked = '1';
                cellK.setAttribute('contenteditable', 'false');
            }
        });

        // 初始化三个表格
        pieceTable.build();
        // 默认已有一条片（不追加物理行，复用初始3行内的空行）
        pieceTable.addItem(false);
        procTable.build();
        partTable.build();
        // 默认已有一条配件（不追加物理行，复用初始3行内的空行）
        partTable.addItem(false);
        // 初始配件：名称默认"纸箱"，数量已在 onAddItem 中默认 1
        partTable.getCell(1, 1).textContent = '纸箱';
        // 默认已有三条工序：开料、钻石刨、精雕（不追加物理行，复用初始6行内的空行）
        procTable.addItem(false);
        procTable.getCell(1, 2).querySelector('select').value = '开料';
        procTable.getCell(1, 10).textContent = '1';
        procTable.addItem(false);
        procTable.getCell(2, 2).querySelector('select').value = '钻石刨';
        procTable.getCell(2, 10).textContent = '1';
        procTable.addItem(false);
        procTable.getCell(3, 2).querySelector('select').value = '精雕';
        procTable.getCell(3, 10).textContent = '1';
        procTable.updateSummaryRow();

        // ============================================================
        // 汇总表格：无行号、无增删按钮，仅 A~Z 字母表头 + 可编辑空行
        // ============================================================
        function buildSummaryTable(rows = 5) {
            const table = document.getElementById('gridSummary');
            const thead = document.createElement('thead');
            const headRow = document.createElement('tr');
            const corner = document.createElement('th');
            corner.className = 'corner';
            corner.textContent = '汇总';
            headRow.appendChild(corner);
            for (let c = 0; c < COLS; c++) {
                const th = document.createElement('th');
                th.textContent = colName(c);
                headRow.appendChild(th);
            }
            thead.appendChild(headRow);
            table.appendChild(thead);
            // 汇总字段标签：第2行 A~G
            const summaryLabels = ['材料成本','工序成本','配件成本','成本总和','利润率','出厂单价','美金价格'];
            const tbody = document.createElement('tbody');
            for (let r = 0; r < rows; r++) {
                const tr = document.createElement('tr');
                // 补一个空 td 对应 thead 的 corner，保证 A~Z 列对齐
                const leadTd = document.createElement('td');
                leadTd.className = 'row-num';
                tr.appendChild(leadTd);
                for (let c = 0; c < COLS; c++) {
                    const td = document.createElement('td');
                    td.dataset.row = r;
                    td.dataset.col = c;
                    // 第1行(r=0) A~G 列填入字段标签，锁定不可编辑
                    if (r === 0 && c < summaryLabels.length) {
                        td.textContent = summaryLabels[c];
                        td.classList.add('locked');
                        td.dataset.locked = '1';
                        td.setAttribute('contenteditable', 'false');
                    }
                    // 第2行(r=1) A~D 列：材料成本/工序成本/配件成本/成本总和，锁定，由联动自动填入
                    else if (r === 1 && c <= 3) {
                        td.classList.add('locked','summary-total');
                        td.dataset.locked = '1';
                        td.setAttribute('contenteditable', 'false');
                    } else {
                        td.setAttribute('contenteditable', 'true');
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
        }
        buildSummaryTable(5);

        // 联动：从片/工序/配件表格合计行取值，填入汇总表格第2行
        function getSummaryValue(table, labelCol, labelText, valueCol) {
            const tbody = table.tbody;
            for (let r = 0; r < table.rowCount; r++) {
                const labelTd = table.getCell(r, labelCol);
                if (labelTd && labelTd.textContent.trim() === labelText) {
                    const valTd = table.getCell(r, valueCol);
                    if (valTd) {
                        const txt = valTd.textContent.trim();
                        if (txt !== '') {
                            const v = parseFloat(txt);
                            if (!isNaN(v)) return v;
                        }
                    }
                    return null;
                }
            }
            return null;
        }

        function fmtNum(v) {
            return Number.isInteger(v) ? v.toString() : v.toFixed(2);
        }

        function updateSummaryTable() {
            const grid = document.getElementById('gridSummary');
            // 汇总表格尚未构建时直接返回（避免初始化阶段报错中断脚本）
            if (!grid || !grid.querySelector('td[data-row="1"]')) return;
            const getSumCell = (col) => grid.querySelector(`td[data-row="1"][data-col="${col}"]`);
            const matCell = getSumCell(0); // A 材料成本
            const procCell = getSumCell(1); // B 工序成本
            const partCell = getSumCell(2); // C 配件成本
            const totalCell = getSumCell(3); // D 成本总和

            const matVal = getSummaryValue(pieceTable, 11, '单套材料成本', 12);
            const procVal = getSummaryValue(procTable, 10, '单套工序总价', 11);
            const partVal = getSummaryValue(partTable, 9, '单套配件成本', 10);

            matCell.textContent = matVal !== null ? fmtNum(matVal) : '';
            procCell.textContent = procVal !== null ? fmtNum(procVal) : '';
            partCell.textContent = partVal !== null ? fmtNum(partVal) : '';

            const vals = [matVal, procVal, partVal].filter(v => v !== null);
            if (vals.length > 0) {
                const total = vals.reduce((a, b) => a + b, 0);
                totalCell.textContent = fmtNum(total);
            } else {
                totalCell.textContent = '';
            }
        }

        document.getElementById('inpTopQty').addEventListener('input', refreshAllPieceRows);

        // 公式栏：写入当前活动表格的活动单元格
        document.getElementById('formulaInput').addEventListener('input', function () {
            if (!activeTable || !activeTable.activeCell) return;
            const cell = activeTable.activeCell;
            if (cell.dataset.locked === '1') return;
            cell.textContent = this.value;
            const c = Number(cell.dataset.col);
            const r = Number(cell.dataset.row);
            if (!activeTable.validateCellInput(cell, c)) cell.textContent = '';
            const cellA = activeTable.getCell(r, 0);
            if (cellA && cellA.dataset[activeTable.itemMarker] === '1') activeTable.recalcRow(r);
        });

        // 初始联动一次
        updateSummaryTable();
    </script>
</body>
</html>
